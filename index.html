<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="喫煙所ボード">
<title>喫煙所ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap">
<style>
/* =========================================================
   喫煙所ボード（iPad常時表示用）— NEON
   画面は決まったサイズの1枚として作り、端末に合わせて丸ごと拡大縮小する
   ========================================================= */
:root{
  --bg:#07040f; --text:#eef9ff; --sub:#97abc4; --faint:#55658a; --rule:rgba(5,217,232,.28);
  --cyan:#05d9e8; --mag:#ff3d7f; --yel:#f9f002; --ok:#2ee6f2; --stop:#ff3d7f;
  --mono:"Share Tech Mono",ui-monospace,monospace; --num:"Orbitron",sans-serif; --jp:"Noto Sans JP","Hiragino Sans",sans-serif; --jph:var(--jp);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--text);font-family:var(--jp);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  background:
    radial-gradient(900px 520px at 100% -8%,rgba(255,61,127,.15),transparent 62%),
    radial-gradient(900px 520px at -6% 108%,rgba(5,217,232,.13),transparent 62%),
    linear-gradient(rgba(5,217,232,.04) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(5,217,232,.04) 1px,transparent 1px) 0 0/32px 100%,#07040f}
#fit{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:22px 26px 14px;display:grid}
#stage.land{width:1180px;height:780px;grid-template-columns:590px 1fr;column-gap:36px;grid-template-rows:1fr 14px;row-gap:12px;
  grid-template-areas:"L R" "foot foot"}
#stage.port{width:820px;height:1580px;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;row-gap:24px;
  grid-template-areas:"L" "R" "foot"}
.colL{grid-area:L;display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0;overflow:hidden}
.colR{grid-area:R;display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0;overflow:hidden}
#stage.port .train{height:340px;flex:none}
#stage.port .fortune{height:400px;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* セクション見出し：番号＋英字＋日本語＋細い罫線 */
.sh{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--cyan);white-space:nowrap;margin-bottom:10px}
.sh .no{color:var(--faint)}
.sh .jp{font-family:var(--jph);font-weight:900;letter-spacing:.06em;color:var(--cyan);font-size:15px}
.sh .rl{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.sh .aux{color:var(--sub);font-family:var(--jp);font-size:12px;letter-spacing:.02em}

/* ---- 時計（枠なし） ---- */
.clock{display:flex;flex-direction:column;justify-content:flex-end;min-width:0;flex:none}
#time{font-family:var(--num);font-weight:800;font-size:108px;line-height:.9;letter-spacing:.01em;text-shadow:0 0 18px rgba(5,217,232,.45)}
#time .sec{font-size:34px;color:var(--mag);margin-left:10px;text-shadow:0 0 10px rgba(255,61,127,.6);vertical-align:.1em}
.dline{display:flex;align-items:baseline;gap:14px;margin-top:12px;white-space:nowrap}
#date{font-size:24px;font-weight:900;letter-spacing:.04em}
#dateEn{font-family:var(--mono);font-size:15px;color:var(--sub);letter-spacing:.2em}
#alerts{margin-top:8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;min-height:24px;color:var(--cyan)}
#alerts .a{margin-right:18px}
#alerts .a::before{content:"▲ ";font-size:12px}
#alerts .w{color:var(--yel)} #alerts .s{color:var(--mag)}

/* ---- 天気（いま・4日間・12時間をひとまとめ） ---- */
.wx{flex:none;display:flex;flex-direction:column;min-width:0}
.wtop{display:grid;grid-template-columns:1fr 268px;column-gap:14px;align-items:center}
.nrow{display:flex;align-items:center;gap:12px;min-width:0}
#nowIcon{font-size:52px;line-height:1}
#nowTemp{font-family:var(--num);font-weight:800;font-size:62px;line-height:1}
#nowTemp sup{font-size:.42em;vertical-align:.95em;margin-left:2px}
.ndesc{min-width:0}
.ndesc b{display:block;font-size:17px;font-weight:900;white-space:nowrap;margin-top:6px}
.ndesc span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-top:3px;white-space:nowrap}
.nstats{display:flex;justify-content:space-between;margin-top:10px;padding:7px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap}
.nstats div{font-size:13px;color:var(--sub);font-weight:700}
.nstats b{font-family:var(--num);font-size:18px;color:var(--text);margin-left:7px;font-weight:600}
.nstats b.hi{color:#ff7aa5} .nstats b.lo{color:#6fe6f2}
#days{display:grid;grid-template-columns:repeat(4,1fr)}
.day{text-align:center;font-size:13px;font-weight:700}
.day+.day{border-left:1px solid var(--rule)}
.day .i{font-size:22px;line-height:1.3}
.day .v{font-family:var(--num);font-size:13px;font-weight:600}
.day .hi{color:#ff7aa5} .day .lo{color:#6fe6f2}
.day .p{font-family:var(--mono);color:var(--cyan);font-size:12px;margin-top:1px}
.hlab{font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}
#hours{display:grid;grid-template-columns:repeat(12,1fr)}
.h{text-align:center}
.h .t{font-family:var(--mono);color:var(--sub);font-size:12px}
.h .i{font-size:19px;line-height:1.35}
.h .v{font-family:var(--num);font-size:13px;font-weight:600}
.h .bar{height:18px;display:flex;align-items:flex-end;justify-content:center;margin-top:3px}
.h .bar i{display:block;width:50%;background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.5)}
.h .p{font-family:var(--mono);font-size:11px;color:var(--cyan)}

/* ---- 電車（唯一の枠付きパネル＝主役） ---- */
.train{flex:1;position:relative;padding:14px 22px 12px;background:rgba(18,8,30,.82);min-height:0;display:flex;flex-direction:column;
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);
  box-shadow:inset 0 0 0 1px rgba(var(--lcr),.55);--lc:#ff3d7f;--lcr:255,61,127}
.train::after{content:"";position:absolute;right:0;top:0;width:37px;height:1px;background:rgba(var(--lcr),.55);transform-origin:right top;transform:rotate(45deg) translate(0,0);right:-1px}
.train .sh,.train .sh .jp{color:var(--lc)}
.train .sh .rl{background:linear-gradient(90deg,rgba(var(--lcr),.35),transparent)}
.tline{display:flex;align-items:center;gap:10px;white-space:nowrap}
.smark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e5609a;color:#fff;font-family:var(--num);font-size:12px;font-weight:800}
#trainTitle{font-size:18px;font-weight:900}
#trainTitle small{font-size:14px;color:var(--sub);font-weight:700;margin-left:6px}
.status{margin-left:auto;font-size:15px;font-weight:700;padding:3px 12px;border:1px solid currentColor;color:var(--sub);white-space:nowrap}
.status::before{content:"● "}
.status.normal{color:var(--ok)} .status.delay{color:var(--yel);background:rgba(249,240,2,.1)} .status.stop{color:#fff;background:var(--stop);border-color:var(--stop)}
#statusDetail{font-size:13px;color:var(--yel);margin-top:5px;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{display:flex;align-items:flex-end;gap:16px;margin-top:8px;white-space:nowrap;min-width:0}
.cd .lab{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;min-height:18px}
#nextIn{font-family:var(--num);font-weight:800;font-size:90px;line-height:.9;color:var(--lc);text-shadow:0 0 16px rgba(var(--lcr),.45)}
.train.has-detail #nextIn{font-size:78px}
.train.has-detail .cd{margin-top:4px}
#nextIn.soon{color:var(--yel);text-shadow:0 0 16px rgba(249,240,2,.5)}
#nextIn.txt{font-family:var(--jph);font-weight:900;font-size:44px;color:var(--text);text-shadow:none}
#nextAt{font-size:17px;color:var(--sub);font-weight:700;padding-bottom:6px;min-width:0}
#nextAt b{font-family:var(--num);font-size:28px;color:var(--text);font-weight:600;margin-right:4px}
#tBoard{margin-top:auto;padding-top:2px;border-top:1px solid rgba(var(--lcr),.3)}
#tBoard .r{display:grid;grid-template-columns:110px 1fr auto;align-items:center;height:31px;border-bottom:1px dashed rgba(var(--lcr),.18);font-size:20px}
#tBoard .r:last-child{border-bottom:none}
#tBoard .tm{font-family:var(--num);font-weight:600}
#tBoard .dst{font-size:15px;color:var(--sub);font-weight:700}
#tBoard .rm{font-family:var(--num);font-weight:600;font-size:20px;color:var(--cyan);letter-spacing:.02em}
#tBoard .rm::before{content:"あと";font-family:var(--jp);font-weight:700;color:var(--faint);font-size:13px;margin-right:8px}
#tBoard .last .dst::after{content:"　終電";color:var(--yel)}

.train > *{position:relative;z-index:1}
.tpage{flex:1;min-height:0;display:flex;flex-direction:column;transition:transform .45s ease,opacity .45s ease}
.train{touch-action:none;-webkit-user-select:none;user-select:none}
#trainDots i.on{background:var(--lc);box-shadow:0 0 6px rgba(var(--lcr),.7)}
#nextAt.long{font-size:15px}
/* 案共通：タブ・透かし・帯は使う案でだけ表示 */
.ttabs,.train .wm{display:none}
/* 案B：路線タブ（両方の路線名を常に表示し、表示中の方を点灯） */
.tv-b .sh .jp,.tv-b #trainTap,.tv-b #trainDots{display:none}
.tv-b .ttabs{display:flex;gap:6px}
.ttabs b{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:900;padding:3px 12px 3px 4px;border:1px solid rgba(255,255,255,.14);color:var(--faint);background:rgba(255,255,255,.03);cursor:pointer;white-space:nowrap}
.ttabs b i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-style:normal;font-family:var(--num);font-size:10px;font-weight:800;color:#fff;opacity:.45}
.ttabs b.on{color:#fff;border-color:var(--c);background:rgba(var(--cr),.22);box-shadow:0 0 10px rgba(var(--cr),.35)}
.ttabs b.on i{opacity:1}
/* 案C：大きな路線名＋左端の色帯 */
.tv-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--lc);box-shadow:0 0 14px rgba(var(--lcr),.6);z-index:2}
.tv-c .tline{margin-top:2px}
.tv-c .smark{width:34px;height:34px;font-size:13px}
.tv-c #trainTitle{font-size:23px;color:var(--lc)}
.tv-c #trainTitle small{font-size:14px;color:var(--sub)}
.tv-c #nextIn{font-size:106px}
.train.tv-c.has-detail #nextIn{font-size:90px}
/* 「本日の運行は終了」などの文字は、カウントダウン用の大きさにしない */
.train #nextIn.txt,.train.tv-c #nextIn.txt,.train.tv-c.has-detail #nextIn.txt{font-size:44px}
.tv-c .cd{margin-top:4px}
.tv-c .cd .lab{margin-bottom:2px}
.tv-c #tBoard .r{height:28px}
/* 案D：路線の頭文字の大きな透かし */
.tv-d .wm{display:block;position:absolute;right:14px;bottom:-34px;z-index:0;font-family:var(--jph);font-weight:900;font-size:300px;line-height:1;
  color:rgba(var(--lcr),.10);pointer-events:none}
.tv-d #trainTitle{color:var(--lc)}
.train.tv-d{overflow:hidden}
/* 色の塗り分けをしない（比較用の現状） */
.tv-0{--lc:#ff3d7f !important;--lcr:255,61,127 !important}

/* ---- 星座占い（枠なし・4列） ---- */
.fortune{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
#fCols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);min-height:0}
.fc4{position:relative;padding:4px 10px 0 12px;display:flex;flex-direction:column;min-width:0}
.fc4+.fc4{border-left:1px solid var(--rule)}
.fc4 .gl{font-size:34px;line-height:1;color:var(--cyan);font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp)}
.fc4 .nm{font-size:18px;font-weight:900;margin-top:6px;white-space:nowrap}
.fc4 .rk{display:flex;align-items:baseline;gap:4px;margin-top:8px}
.fc4 .rk b{font-family:var(--num);font-weight:800;font-size:42px;line-height:1;color:var(--text)}
.fc4 .rk span{font-family:var(--mono);font-size:13px;color:var(--faint)}
.fc4.top .rk b{color:var(--yel);text-shadow:0 0 12px rgba(249,240,2,.45)}
.fc4.top .gl{color:var(--yel)}
.fc4 .mt{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:8px}
.fc4 .mt i{height:8px;background:rgba(255,255,255,.08)}
.fc4 .mt i.on{background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.6)}
.fc4.top .mt i.on{background:var(--yel);box-shadow:0 0 6px rgba(249,240,2,.6)}
.fc4 .k{font-size:12px;font-weight:700;color:var(--faint);margin-top:12px}
.fc4 .it{font-size:17px;font-weight:700;height:25px;line-height:25px;margin-top:3px;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.fc4 .co{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:700;margin-top:3px;white-space:nowrap}
.fc4 .co i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex:none}
.fc4 .sub3{margin-top:auto;padding:10px 0 2px;display:grid;gap:6px}
.fc4 .sub3 div{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:700}
.fc4 .sub3 span{display:flex;gap:4px}
.fc4 .sub3 span i{width:9px;height:9px;transform:rotate(45deg);background:rgba(255,255,255,.12)}
.fc4 .sub3 span i.on{background:var(--mag);box-shadow:0 0 5px rgba(255,61,127,.7)}
.fc4{padding-bottom:4px}
.fortune.t1 .fc4 .gl{font-size:28px} .fortune.t1 .fc4 .k{margin-top:8px} .fortune.t1 .fc4 .sub3{gap:3px;padding-top:6px}
.fortune.t2 .fc4 .rk b{font-size:34px} .fortune.t2 .fc4 .nm{margin-top:3px} .fortune.t2 .fc4 .sub3 div{font-size:12px}
.fortune.t3 .fc4 .gl{display:none}
.fmsg{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;text-align:center;line-height:1.7}

/* ---- ニュース ---- */
.news{flex:none;height:178px;display:flex;flex-direction:column;min-width:0}
#newsList{display:flex;flex-direction:column}
.nw{display:grid;grid-template-columns:78px 90px 1fr;align-items:center;height:27px;border-bottom:1px dashed rgba(5,217,232,.16)}
.nw:last-child{border-bottom:none}
.nw .tm{font-family:var(--mono);font-size:13px;color:var(--cyan)}
.nw .tg{justify-self:start;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--rule);padding:1px 6px;line-height:1.4}
.nw .tt{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw.new .tm{color:var(--mag)}
.nmsg{color:var(--sub);font-size:14px;padding-top:8px}
/* ニュース欄の切り替え */
.nslides{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.nslide{position:absolute;inset:0;opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .7s ease,transform .7s ease}
.nslide.on{opacity:1;transform:none;pointer-events:auto}
.nslide.out{transform:translateX(-40px)}
#gigaList{display:flex;flex-direction:column}
/* 為替・暗号資産 */
#mkt{display:grid;grid-template-columns:.85fr 1.15fr;column-gap:22px;padding-top:2px}
#mkt .col{display:flex;flex-direction:column;min-width:0}
#mkt .mh{font-size:11px;font-weight:700;color:var(--faint);height:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#mkt .mr{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px;height:27px;border-bottom:1px dashed rgba(5,217,232,.16);white-space:nowrap}
#mkt .mr:last-child{border-bottom:none}
#mkt .nm{font-size:14px;font-weight:700;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
#mkt .nm b{font-family:var(--num);font-size:11px;color:var(--faint);font-weight:600;margin-left:6px}
#mkt .pr{font-family:var(--num);font-size:18px;font-weight:600;text-align:right}
#mkt .pr small{font-size:12px;color:var(--sub);margin-right:2px}
#mkt .ch{grid-column:1/-1;display:none}
#mkt .mr{grid-template-columns:auto 1fr auto}
#mkt .pc{font-family:var(--num);font-size:12px;font-weight:600;min-width:62px;text-align:right;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px}
#mkt .pc.up{color:var(--mag)} #mkt .pc.dn{color:var(--cyan)} #mkt .pc.na{color:var(--faint)}
.tri{width:9px;height:9px;flex:none}
/* 今日は何の日 */
#todayBox{display:flex;flex-direction:column}
#todayBox .r{display:grid;grid-template-columns:78px 52px 1fr auto;align-items:center;column-gap:4px;height:30px;border-bottom:1px dashed rgba(5,217,232,.16);white-space:nowrap}
#todayBox .r:last-child{border-bottom:none}
#todayBox .lb{justify-self:start;font-size:11px;font-weight:700;color:var(--cyan);border:1px solid rgba(5,217,232,.45);padding:1px 8px}
#todayBox .lb.b{color:var(--mag);border-color:rgba(255,61,127,.55)}
#todayBox .lb.s{color:var(--yel);border-color:rgba(249,240,2,.5)}
#todayBox .yr{font-family:var(--num);font-size:14px;font-weight:700;color:var(--mag)}
#todayBox .tx{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
#todayBox .ak{font-family:var(--num);font-size:14px;font-weight:700;color:var(--cyan);margin-left:8px;text-align:right}
#todayBox .ak small{font-family:var(--jp);font-size:11px;color:var(--faint);margin-left:6px}
#todayBox .none{font-size:12px;font-weight:700;color:var(--faint);height:22px;display:flex;align-items:center}
/* 案A：タイル */
#mkt.mv-a{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-top:4px}
.mv-a .tl{grid-column:span 2;display:flex;flex-direction:column;justify-content:space-between;height:64px;padding:6px 10px 6px;background:rgba(5,217,232,.05);border:1px solid rgba(5,217,232,.18);min-width:0}
.mv-a .tl.fx{grid-column:span 3}
.mv-a .tl .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.mv-a .tl .v{font-family:var(--num);font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden}
.mv-a .tl .v small{font-size:13px;color:var(--sub);margin-right:2px}
.mv-a .tl.up{border-color:rgba(255,61,127,.45);background:rgba(255,61,127,.07)}
.mv-a .tl.dn{border-color:rgba(5,217,232,.45)}
/* 案B：電光掲示板（横に流れる） */
#mkt.mv-b{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.mv-b .band{position:relative;height:58px;overflow:hidden;border-top:1px solid rgba(249,240,2,.25);border-bottom:1px solid rgba(249,240,2,.25);
  background:radial-gradient(rgba(249,240,2,.10) 1px,transparent 1.4px) 0 0/5px 5px,rgba(20,14,0,.6)}
.mv-b .band .lbl{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:900;color:#000;background:var(--yel)}
.mv-b .run{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;animation:tick var(--dur,30s) linear infinite}
.mv-b .run span.it{display:inline-flex;align-items:baseline;gap:10px;margin-right:46px;font-family:var(--num);font-size:30px;font-weight:600;color:var(--yel);text-shadow:0 0 8px rgba(249,240,2,.55)}
.mv-b .run span.it em{font-style:normal;font-family:var(--jp);font-size:16px;font-weight:900;color:#fff2a8}
.mv-b .run .pc{font-size:16px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* 電光掲示板の整理案（B1〜B4）共通 */
#mkt[class^="mv-b"]{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.led{position:relative;overflow:hidden;border-top:1px solid rgba(249,240,2,.28);border-bottom:1px solid rgba(249,240,2,.28);
  background:radial-gradient(rgba(249,240,2,.10) 1px,transparent 1.4px) 0 0/5px 5px,rgba(20,14,0,.6)}
.led .lbl{position:absolute;left:0;top:0;bottom:0;z-index:2;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#000;background:var(--yel);line-height:1.15;text-align:center}
.led .lbl small{font-size:10px;font-weight:700}
.led .run{position:absolute;top:0;bottom:0;left:78px;display:flex;align-items:center;white-space:nowrap;animation:tick 30s linear infinite;will-change:transform}
.led .it{display:inline-flex;align-items:baseline;gap:10px;padding:0 22px;font-family:var(--num);font-weight:600;color:var(--yel);text-shadow:0 0 8px rgba(249,240,2,.55)}
.led .it em{font-style:normal;font-family:var(--jp);font-weight:900;color:#fff2a8}
.led .sep{color:rgba(249,240,2,.35);font-size:12px}
.led .pc{font-size:15px}
.ledinfo{font-size:11px;font-weight:700;color:var(--faint);display:flex;justify-content:space-between;white-space:nowrap}
/* B1：2段・同じ速さで流れる */
.mv-b1 .led{height:56px}
.mv-b1 .it{font-size:28px}.mv-b1 .it em{font-size:15px}
/* B2：為替は止めて、暗号資産だけ流す */
.mv-b2 .led{height:56px}
.mv-b2 .fix{position:absolute;left:78px;right:0;top:0;bottom:0;display:grid;grid-template-columns:1fr 1fr}
.mv-b2 .fix .it{justify-content:center;font-size:26px;padding:0 8px}
.mv-b2 .fix .it + .it{border-left:1px dashed rgba(249,240,2,.25)}
.mv-b2 .it{font-size:28px}.mv-b2 .it em{font-size:14px}
/* B3：1本の太い帯に全部を流す */
.mv-b3 .led{height:96px}
.mv-b3 .lbl{width:64px;font-size:12px}
.mv-b3 .run{left:64px}
.mv-b3 .it{font-size:44px;padding:0 26px}.mv-b3 .it em{font-size:18px}.mv-b3 .pc{font-size:18px}
/* B4：流さずに1銘柄ずつ切り替え */
.mv-b4 .led{height:96px}
.mv-b4 .one{position:absolute;left:78px;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
.mv-b4 .one .it{font-size:46px;animation:flipin .45s ease}
.mv-b4 .one .it em{font-size:18px}
.mv-b4 .one .pc{font-size:20px}
@keyframes flipin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mv-b4 .pips{display:flex;gap:5px;justify-content:center}
.mv-b4 .pips i{width:16px;height:3px;background:rgba(249,240,2,.2)}
.mv-b4 .pips i.on{background:var(--yel);box-shadow:0 0 6px rgba(249,240,2,.7)}
/* 案C：主役（BTC）＋小さなグラフ */
#mkt.mv-c{display:grid;grid-template-columns:1.05fr 1fr;column-gap:20px;padding-top:4px}
.mv-c .hero{display:flex;flex-direction:column;min-width:0}
.mv-c .hero .t{font-size:12px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.mv-c .hero .v{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.15;white-space:nowrap}
.mv-c .hero .v small{font-size:15px;color:var(--sub);margin-right:3px}
.mv-c .hero svg.sp{width:100%;height:52px;margin-top:4px}
.mv-c .lst{display:flex;flex-direction:column}
.mv-c .lr{display:grid;grid-template-columns:74px 50px 1fr auto;align-items:center;column-gap:8px;height:33px;border-bottom:1px dashed rgba(5,217,232,.16);white-space:nowrap}
.mv-c .lr:last-child{border-bottom:none}
.mv-c .lr .nm{font-size:13px;font-weight:700;color:var(--sub)}
.mv-c .lr svg.sp{width:50px;height:18px}
.mv-c .lr .pr{font-family:var(--num);font-size:16px;font-weight:600;text-align:right}
.mv-c .lr .pr small{font-size:11px;color:var(--sub)}
/* 案D：増減メーター（中央が0、右に伸びると上昇・左に伸びると下落） */
#mkt.mv-d{display:flex;flex-direction:column;padding-top:2px}
.mv-d .dr{display:grid;grid-template-columns:40px 76px 1fr 96px 62px;align-items:center;column-gap:10px;height:28px;border-bottom:1px dashed rgba(5,217,232,.14);white-space:nowrap}
.mv-d .dr:last-child{border-bottom:none}
.mv-d .g{font-size:10px;font-weight:700;color:var(--faint);border:1px solid var(--rule);text-align:center;padding:1px 0}
.mv-d .nm{font-size:14px;font-weight:700;color:var(--sub)}
.mv-d .pr{font-family:var(--num);font-size:18px;font-weight:600;text-align:right}
.mv-d .pr small{font-size:12px;color:var(--sub);margin-right:2px}
.mv-d .mt{position:relative;height:10px;background:rgba(255,255,255,.05)}
.mv-d .mt::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.35)}
.mv-d .mt i{position:absolute;top:0;bottom:0}
.mv-d .mt i.up{left:50%;background:var(--mag);box-shadow:0 0 6px rgba(255,61,127,.6)}
.mv-d .mt i.dn{right:50%;background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.6)}

.foot{grid-area:foot;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-align:right;align-self:end}
.foot a{color:inherit}
#stage.port .foot{white-space:normal;line-height:1.6;align-self:start}
#offline{display:none;color:var(--yel)}

/* ---- 右下の欄：時間でスライド ---- */
.slides{position:relative;flex:1;min-height:0;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateX(40px);pointer-events:none;
  transition:opacity .7s ease,transform .7s ease}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.out{transform:translateX(-40px)}
.slide > div{flex:1;min-height:0;display:flex;flex-direction:column}
#fCols{display:grid}
.dots{display:flex;gap:6px;align-items:center;margin-right:10px}
.dots i{width:18px;height:3px;background:rgba(255,255,255,.15)}
.dots i.on{background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.7)}
/* 月と太陽 */
.sky{display:grid;grid-template-columns:200px 1fr;column-gap:26px;align-items:center;align-content:center;row-gap:6px;flex:1}
.sky .moon{position:relative;width:180px;height:180px;margin:0 auto}
.sky .moon svg{width:100%;height:100%;overflow:visible}
.sky .mname{font-size:26px;font-weight:700;margin-bottom:4px}
.sky .mage{font-size:15px;color:var(--sub);font-weight:700}
.sky .mage b{font-family:var(--num);font-size:22px;color:var(--text);margin:0 4px;font-weight:600}
.sky .nx{display:flex;gap:22px;margin-top:12px;font-size:14px;color:var(--sub);font-weight:700}
.sky .nx b{display:block;font-family:var(--num);font-size:20px;color:var(--text);font-weight:600;margin-top:2px}
.sky .sun{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
.sky .sun div{font-size:13px;color:var(--sub);font-weight:700}
.sky .sun b{display:block;font-family:var(--num);font-size:24px;color:var(--text);font-weight:600;margin-top:2px}
.sky .sun .rise b{color:#ffd166} .sky .sun .set b{color:#ff7aa5}
.sky .daybar{grid-column:1/-1;margin-top:16px;position:relative;height:6px;background:rgba(255,255,255,.07)}
.sky .daybar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#ffd166,#ff7aa5);box-shadow:0 0 8px rgba(255,209,102,.4)}
.sky .daybar em{position:absolute;top:-5px;width:2px;height:16px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.sky .daylab{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--num);font-size:11px;color:var(--faint);margin-top:5px}
/* カウントダウン */
/* カウントダウン：1年のドット暦 */
#countBox .cyan{--c:var(--cyan);--cr:5,217,232}#countBox .mag{--c:var(--mag);--cr:255,61,127}
#countBox .yel{--c:var(--yel);--cr:249,240,2}#countBox .txt{--c:#e8eef8;--cr:232,238,248}
.ve{display:flex;flex-direction:column;flex:1;min-height:0}
.ve .cs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:2px}
.ve .cs>div{border-top:2px solid var(--c);padding-top:6px;min-width:0}
.ve .cs b{font-family:var(--num);font-size:30px;font-weight:800;line-height:1;color:var(--text)}
.ve .cs b small{font-family:var(--jp);font-size:11px;font-weight:700;color:var(--sub);margin-left:3px}
.ve .cs span{display:block;font-size:12px;font-weight:900;color:var(--c);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ve .cal{display:grid;grid-template-columns:28px repeat(31,11px);gap:3px;margin-top:16px;align-items:center}
.ve .cal .m{font-family:var(--num);font-size:9px;color:var(--faint);text-align:right;padding-right:4px}
.ve .cal i{width:11px;height:11px;box-sizing:border-box;border:1px solid rgba(255,255,255,.12)}
.ve .cal i.p{background:rgba(5,217,232,.32);border-color:transparent}
.ve .cal i.hd{border-color:rgba(5,217,232,.8)}
.ve .cal i.p.hd{background:rgba(5,217,232,.55)}
.ve .cal i.t{background:#fff;border-color:#fff;box-shadow:0 0 8px #fff,0 0 14px var(--cyan);animation:tdp 2s ease-in-out infinite}
@keyframes tdp{50%{opacity:.45}}
.ve .cal i.ev{background:var(--c);border-color:var(--c);box-shadow:0 0 6px rgba(var(--cr),.9)}
.ve .cal i.x{visibility:hidden}
.ve .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--faint);padding-bottom:4px;white-space:nowrap}
.ve .ft b{font-family:var(--num);font-size:15px;color:var(--text);margin:0 4px}
.ve .lg{display:flex;gap:12px}.ve .lg span{display:flex;align-items:center;gap:5px}
.ve .lg i{width:9px;height:9px;display:inline-block;box-sizing:border-box}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;flex:1;align-content:start;padding-top:4px}
.cnt .c{border-left:3px solid var(--cyan);padding:8px 14px;background:rgba(5,217,232,.04)}
.cnt .c.mag{border-left-color:var(--mag);background:rgba(255,61,127,.05)}
.cnt .c.yel{border-left-color:var(--yel);background:rgba(249,240,2,.04)}
.cnt .c .l{font-size:13px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt .c .v{font-family:var(--num);font-weight:800;font-size:40px;line-height:1.15;color:var(--text)}
.cnt .c .v small{font-family:var(--jp);font-size:15px;font-weight:700;color:var(--sub);margin-left:4px}
.cnt .c .s{font-size:12px;color:var(--faint);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt .yr{grid-column:1/-1;margin-top:4px}
.cnt .yr .bar{height:10px;background:rgba(255,255,255,.07);margin-top:8px;position:relative}
.cnt .yr .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 8px rgba(5,217,232,.6)}

/* アニメクイズ */
.qz{flex:1;display:flex;flex-direction:column;min-height:0}
.qz .qh{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--sub)}
.qz .qh .qn{font-family:var(--num);font-size:13px;color:var(--mag);border:1px solid var(--mag);padding:1px 8px}
.qz .qh .gen{border:1px solid var(--rule);padding:1px 8px}
.qz .qq{font-size:24px;font-weight:700;line-height:1.5;margin:10px 0 12px;min-height:72px}
.qz .qq b{color:var(--cyan)}
.qz .ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qz .ch div{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:18px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid var(--rule);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .4s,border-color .4s,opacity .4s}
.qz .ch div span{font-family:var(--num);font-size:14px;color:var(--faint);flex:none}
.qz .ch div.lg{font-size:15px;letter-spacing:-.02em}
.qz .ch div.xl{font-size:13px;letter-spacing:-.04em}
.qz .ch div.ok{background:rgba(249,240,2,.14);border-color:var(--yel);color:var(--yel);box-shadow:0 0 12px rgba(249,240,2,.25)}
.qz .ch div.ok span{color:var(--yel)}
.qz .ch div.ng{background:rgba(255,61,127,.12);border-color:var(--mag)}
.qz.done .ch div:not(.ok){opacity:.35}
.qz .tb{margin-top:auto;display:flex;align-items:center;gap:10px}
.qz .tb .bar{flex:1;height:5px;background:rgba(255,255,255,.08);position:relative}
.qz .tb .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--mag);box-shadow:0 0 8px rgba(255,61,127,.6)}
.qz .tb .sec{font-family:var(--num);font-size:18px;font-weight:600;color:var(--text);min-width:34px;text-align:right}
.qz .ans{margin-top:10px;font-size:15px;font-weight:700;color:var(--yel);min-height:22px}
.qz .ans small{color:var(--sub);font-weight:700;margin-left:8px}
.qz.tap .ch div{cursor:pointer}
/* 伏せ字 */
.qz .rv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.qz .rv i{display:grid;place-items:center;font-style:normal;width:46px;height:52px;font-size:28px;font-weight:700;background:rgba(5,217,232,.06);border:1px solid var(--rule)}
.qz .rv i.h{color:transparent;background:repeating-linear-gradient(-45deg,rgba(5,217,232,.12) 0 6px,rgba(5,217,232,.04) 6px 12px)}
.qz .rv i.sp{width:16px;border:none;background:none}
.qz.done .rv i{color:var(--yel);border-color:var(--yel)}
/* ○× */
.qz .ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.qz .ox div{display:grid;place-items:center;height:78px;font-size:52px;font-weight:900;border:1px solid var(--rule);background:rgba(255,255,255,.03);transition:all .4s}
.qz .ox div.o{color:var(--cyan)} .qz .ox div.x{color:var(--mag)}
.qz .ox div.ok{background:rgba(249,240,2,.12);border-color:var(--yel);box-shadow:0 0 14px rgba(249,240,2,.3)}
.qz.done .ox div:not(.ok){opacity:.25}

/* ---- タップできる場所 ---- */
.fc4,.nw{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc4:active,.nw:active{background:rgba(5,217,232,.08)}
.sh .tap{font-family:var(--jp);font-size:11px;color:var(--faint);letter-spacing:.02em}

/* スワイプで切り替え */
.slides{touch-action:none;-webkit-user-select:none;user-select:none}
.qz .ans small{color:var(--sub);font-weight:700;margin-left:10px;font-size:12px}
.qz.done{cursor:pointer}
.qz:not(.done) .ch div{cursor:pointer;-webkit-tap-highlight-color:transparent}
.qz:not(.done) .ch div:active{background:rgba(5,217,232,.16);border-color:var(--cyan)}
.qnext{display:inline-flex;align-items:center;margin-left:auto;flex:none;font:700 13px var(--jp);color:var(--cyan);background:rgba(5,217,232,.08);border:1px solid var(--cyan);
  padding:4px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 0 8px rgba(5,217,232,.2)}
.qnext:active{background:rgba(5,217,232,.25)}
.ic{display:inline-block;width:.78em;height:.78em;margin-left:.45em;vertical-align:-.02em}
.mx .ic{width:.72em;height:.72em}
.qd .qfoot{display:flex;justify-content:flex-end;margin-top:16px}
.qd .qfoot .qnext{font-size:17px;padding:9px 22px}
/* クイズの解説画面 */
.qd .qh{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:10px}
.qd .qh .qn{font-family:var(--num);color:var(--mag);border:1px solid var(--mag);padding:1px 8px}
.qd .qh .gen{border:1px solid var(--rule);padding:1px 8px}
.qd .res{font-size:40px;font-weight:900;line-height:1.1;margin-bottom:6px;font-family:var(--jph)}
.qd .res.ok{color:var(--yel);text-shadow:0 0 14px rgba(249,240,2,.4)}
.qd .res.ng{color:var(--mag);text-shadow:0 0 14px rgba(255,61,127,.4)}
.qd .res.na{color:var(--cyan);font-size:30px}
.qd .qq{font-size:22px;font-weight:700;line-height:1.5;margin:6px 0 14px;color:#d8e6f3}
.qd .chs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.qd .chs div{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:17px;font-weight:700;color:var(--sub);border:1px solid var(--rule);background:rgba(255,255,255,.03)}
.qd .chs div em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;padding:1px 8px;border:1px solid currentColor;flex:none}
.qd .chs div.ok{color:var(--yel);border-color:var(--yel);background:rgba(249,240,2,.1)}
.qd .chs div.ng{color:var(--mag);border-color:var(--mag);background:rgba(255,61,127,.1)}
.qd .kn{border-left:3px solid var(--cyan);padding:12px 16px;background:rgba(5,217,232,.06)}
.qd .kn p{font-size:20px;line-height:1.75;color:var(--text)}

/* 全国の天気（タイル） */
.wx{cursor:pointer;-webkit-tap-highlight-color:transparent}
.modal.top{align-items:flex-start;padding-top:18px}
.zw h2{font-family:var(--jph);font-size:26px;font-weight:900;margin-bottom:2px}
.zw .note{font-size:12px;color:var(--faint);margin-bottom:14px}
.w3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.w3 .tile{position:relative;height:100px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd)}
.w3 .tile b{font-size:15px;font-weight:900}
.w3 .tile .wi{position:absolute;right:10px;top:8px;font-size:26px;line-height:1}
.w3 .tile .big{font-family:var(--num);font-size:34px;font-weight:700;margin-top:6px;line-height:1}
.w3 .tile .big small{font-size:14px;color:var(--sub)}
.w3 .tile .sm{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w3 .tile.me{outline:2px solid var(--yel);outline-offset:-2px}
.w3 .scale{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint);margin-top:2px}
.w3 .scale i{flex:1;height:6px;background:linear-gradient(90deg,#1b4d9c,#1f8fa8,#3aa36b,#d9a53a,#e0533d)}
.zw .wmsg{color:var(--sub);font-size:15px;padding:40px 0;text-align:center}

/* ---- 連続正解ゲーム（コンボ・フィーバー・ジェネレーター・クリア） ---- */
.fortune{position:relative}
.cbadge{display:inline-flex;align-items:baseline;gap:4px;margin-left:12px;padding:1px 10px;font-family:var(--num);font-size:13px;font-weight:800;letter-spacing:.08em;color:#030207;background:var(--cc);box-shadow:0 0 12px var(--cc)}
.cbadge[hidden]{display:none}
.cbadge small{font-family:var(--mono);font-size:10px;letter-spacing:.2em}
/* コンボ：斜めの帯が横切る */
.cfxB{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.cfxB .band{position:absolute;left:-10%;right:-10%;top:50%;height:120px;margin-top:-60px;transform:skewY(-8deg);background:linear-gradient(90deg,transparent,rgba(3,2,7,.92) 12%,rgba(3,2,7,.92) 88%,transparent);
  border-top:3px solid var(--cc);border-bottom:3px solid var(--cc);box-shadow:0 0 24px var(--cc);animation:bBand 1.5s cubic-bezier(.7,0,.3,1) both}

@keyframes bBand{0%{transform:skewY(-8deg) translateX(-110%)}22%{transform:skewY(-8deg) translateX(0)}78%{transform:skewY(-8deg) translateX(0)}100%{transform:skewY(-8deg) translateX(110%)}}
@keyframes bLines{from{background-position:0 0}to{background-position:-84px 0}}
@keyframes bNum{0%,20%{transform:scale(2.2);opacity:0}30%{transform:scale(.9);opacity:1}38%{transform:scale(1.05)}46%,100%{transform:scale(1)}}
.fortune.cglow{animation:cGlow 1.5s ease-out both}
@keyframes cGlow{0%{box-shadow:0 0 0 2px var(--cc),0 0 40px var(--cc)}100%{box-shadow:0 0 0 1px transparent,0 0 0 transparent}}
/* フィーバー（金色） */
#fvr{position:fixed;inset:0;z-index:700;pointer-events:none;overflow:hidden}

#fvr .sweep{position:absolute;top:-20%;bottom:-20%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,240,180,.45),transparent);transform:skewX(-20deg);animation:fvSweep 1.6s ease-in-out 1.2s both}
#fvr .ban{position:absolute;left:-20%;right:-20%;top:42%;height:150px;transform:rotate(-6deg);background:repeating-linear-gradient(45deg,#ffcc33 0 26px,#ff9f1a 26px 52px);box-shadow:0 0 40px #ffcc33;display:flex;align-items:center;justify-content:center;animation:fvBan 2.4s cubic-bezier(.7,0,.3,1) .3s both}
#fvr .ban b{font-family:var(--num);font-weight:900;font-size:112px;letter-spacing:.2em;color:#1a0f00;text-shadow:4px 4px 0 #fff3c4}
#fvr .mq{position:absolute;left:0;right:0;top:0;height:34px;background:linear-gradient(90deg,#ff9f1a,#ffcc33,#ff9f1a);display:flex;align-items:center;overflow:hidden;animation:fvMq .5s ease 2.6s both}
#fvr .mq div{white-space:nowrap;font-family:var(--num);font-weight:900;font-size:18px;letter-spacing:.3em;color:#1a0f00;animation:fvRun 14s linear infinite}
#fvr .edge{position:absolute;inset:0;box-shadow:inset 0 0 0 4px #ffcc33,inset 0 0 40px rgba(255,204,51,.6);animation:fvIn .6s ease 2.6s both}
@keyframes fvTint{0%{opacity:0}15%{opacity:.75}60%{opacity:.55}100%{opacity:.32}}
@keyframes fvFlash{from{opacity:.9}to{opacity:0}}
@keyframes fvSweep{from{left:-40%}to{left:120%}}
@keyframes fvBan{0%{transform:rotate(-6deg) translateX(-120%)}25%{transform:rotate(-6deg) translateX(0)}75%{transform:rotate(-6deg) translateX(0)}100%{transform:rotate(-6deg) translateX(120%)}}
@keyframes fvMq{from{transform:translateY(-100%)}to{transform:none}}
@keyframes fvRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fvIn{from{opacity:0}to{opacity:1}}
/* ぷちゅん（フリーズ） */
#pz{position:fixed;inset:0;z-index:960;overflow:hidden}
#pz > *{position:absolute;inset:0;opacity:0}
#pz .blk{background:#000}

#pz .wf{background:#fff}

#pz .big b{font-family:var(--num);font-weight:900;font-size:200px;line-height:1;color:#000}
#pz .big span{font-family:var(--num);font-weight:900;font-size:40px;letter-spacing:.4em;color:#000}
/* クイズジェネレーター */
#gen{position:fixed;inset:0;z-index:950;overflow:hidden;background:#05030a;color:#fff;font-family:var(--jp);--gc:#ffcc33;--gd:#ff9f1a;--gr:255,204,51}
#gen .gbox{position:absolute;left:0;top:0;width:1180px;height:780px;transform-origin:0 0}
#gen .g1{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 34px 20px}
#gen .spot{position:absolute;inset:-30%;background:conic-gradient(from 0deg,rgba(var(--gr),0),rgba(var(--gr),.16) 8%,rgba(var(--gr),0) 16%,rgba(255,61,127,.12) 30%,rgba(var(--gr),0) 40%,rgba(var(--gr),.16) 58%,rgba(var(--gr),0) 66%,rgba(5,217,232,.12) 80%,rgba(var(--gr),0) 90%);animation:gSpin 18s linear infinite}
@keyframes gSpin{to{transform:rotate(360deg)}}
#gen .top{position:relative;display:flex;align-items:center;justify-content:space-between}
#gen .tl{display:flex;align-items:center}
#gen .logo{font-family:var(--num);font-weight:900;font-size:30px;letter-spacing:.14em;background:linear-gradient(90deg,#fff,var(--gc),var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(var(--gr),.6))}

@keyframes gPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}

#gen .qbox{position:relative;margin-top:16px;padding:22px 30px 24px;border:2px solid var(--gc);background:linear-gradient(180deg,rgba(var(--gr),.12),rgba(var(--gr),.03));box-shadow:0 0 30px rgba(var(--gr),.25)}
#gen .meta{display:flex;gap:12px;font-size:14px;font-weight:700;color:var(--gc);margin-bottom:10px}

#gen .q{font-size:38px;font-weight:900;line-height:1.35}

#gen .chs div{display:flex;align-items:center;gap:18px;padding:0 22px;font-size:30px;font-weight:900;background:rgba(255,255,255,.05);border:2px solid var(--c);box-shadow:inset 6px 0 0 var(--c);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .2s,transform .2s}
#gen .chs div b{font-family:var(--num);font-size:30px;color:var(--c)}
#gen .chs div.ok{background:rgba(61,255,139,.22);border-color:#3dff8b;box-shadow:0 0 30px rgba(61,255,139,.6),inset 6px 0 0 #3dff8b;transform:scale(1.02)}

#gen .bot{position:relative;display:flex;align-items:center;gap:16px;margin-top:18px;font-size:14px;font-weight:700;color:var(--sub)}
#gen .bar{flex:1;height:12px;background:rgba(255,255,255,.08)}
#gen .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gd),var(--gc));box-shadow:0 0 10px var(--gc)}
#gen .msg{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 10px #000;pointer-events:none}
/* ステージアップ */
#ms{position:fixed;inset:0;z-index:965;pointer-events:none;overflow:hidden}
#ms .dim{position:absolute;inset:0;background:rgba(0,0,0,.75);opacity:0}
#ms .bars{position:absolute;left:-10%;right:-10%;top:50%;height:260px;margin-top:-130px;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.08) 60px 64px),linear-gradient(90deg,transparent,rgba(var(--mr),.35),transparent);border-top:3px solid var(--mc);border-bottom:3px solid var(--mc);transform:scaleY(0);box-shadow:0 0 40px rgba(var(--mr),.6)}

#ms .txt em{font-style:normal;font-size:20px;font-weight:700;color:#fff;margin-top:10px;letter-spacing:.1em}
/* クリア */
#gend{position:fixed;inset:0;z-index:970;pointer-events:none;overflow:hidden}
#gend .dim{position:absolute;inset:0;background:#03020a;opacity:0}
#gend .wf{position:absolute;inset:0;background:#fff;opacity:0}
#gend .aura{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,90,.55),rgba(255,170,40,.18) 38%,transparent 68%);opacity:0}
#gend .rg{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:6px solid #ffcc33;box-shadow:0 0 30px #ffcc33;opacity:0}

#gend .cnt b{font-family:var(--num);font-weight:900;font-size:240px;line-height:1;background:linear-gradient(180deg,#fff6c8,#ffcc33 50%,#c07a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,204,51,.7))}
#gend .cnt small{font-family:var(--num);font-weight:900;font-size:40px;letter-spacing:.4em;color:#fff;margin-top:6px}
#gend .cnt em{font-style:normal;font-family:var(--num);font-weight:900;font-size:56px;letter-spacing:.3em;color:#fff;text-shadow:0 0 20px #ffcc33;margin-bottom:6px;opacity:0}
#gend .shine{position:absolute;top:0;bottom:0;width:180px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);opacity:0}

#gend .ty{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-family:var(--mono);font-size:22px;letter-spacing:.6em;color:#fff3c4;opacity:0}
.clrb{display:inline-flex;align-items:center;margin-left:14px;padding:2px 12px;font-family:var(--num);font-weight:900;font-size:15px;letter-spacing:.2em;color:#1a0f00;background:linear-gradient(90deg,#fff6c8,#ffcc33);box-shadow:0 0 12px #ffcc33;vertical-align:middle}

/* ---- 隠し画面 ---- */
#time{touch-action:manipulation}
#time .sec{position:relative}
#time .sec::after{content:"";position:absolute;inset:-14px -16px}   /* 押しやすいよう当たり判定を広げる */
#hid{position:fixed;inset:0;z-index:800;background:#030207;overflow:hidden;color:var(--text);font-family:var(--jp);cursor:pointer;-webkit-tap-highlight-color:transparent}
#hid[hidden]{display:none}
#hid .hbox{position:absolute;left:0;top:0;width:1180px;height:780px;transform-origin:0 0}
#hid .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#hid .hvig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%)}
.h2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.h2 .lab{font-family:var(--mono);font-size:16px;letter-spacing:.5em;color:rgba(255,61,127,.75)}
.h2 .row{display:flex;align-items:baseline;gap:16px}
.h2 .big{position:relative;font-family:var(--num);font-weight:800;font-size:250px;line-height:1;color:#ff3d7f;text-shadow:0 0 30px rgba(255,61,127,.55);letter-spacing:.02em}
/* 数字の残像（現れる瞬間だけ。そのあと0.5秒で消える） */
.h2 .big::before,.h2 .big::after{content:attr(data-t);position:absolute;left:0;top:0;text-shadow:none;opacity:0;transition:opacity .5s ease}
.h2 .big::before{color:#05d9e8;transform:translate(-10px,0);clip-path:inset(30% 0 62% 0)}
.h2 .big::after{color:#f9f002;transform:translate(12px,0);clip-path:inset(71% 0 23% 0)}
.h2.ghost .big::before,.h2.ghost .big::after{opacity:.55;transition:none}
.h2.jit{animation:hjit .16s steps(1) 1}
@keyframes hjit{0%{transform:translateX(-12px);clip-path:inset(10% 0 45% 0)}25%{transform:translateX(14px);clip-path:inset(50% 0 8% 0)}
  50%{transform:translateX(-6px) skewX(6deg);clip-path:none}75%{transform:translateX(4px)}100%{transform:none}}
.h2 .unit{font-family:var(--jph);font-size:96px;font-weight:900;color:#ff3d7f;text-shadow:0 0 26px rgba(255,61,127,.5);opacity:.92;transform:translateY(-.078em)}
.h2 .clk{font-family:var(--num);font-size:56px;font-weight:600;margin-top:22px;color:var(--text)}
.h2 .sub{font-size:14px;color:var(--faint);margin-top:16px;font-family:var(--mono);letter-spacing:.2em}
/* 切り替え演出（闇に沈む）の重ね板 */
#fxl{position:fixed;inset:0;z-index:900;overflow:hidden}
#fxl > i{position:absolute;inset:0;opacity:0}
#fxl .tint{background:#ff1a4a;mix-blend-mode:color}
#fxl .dark{background:#000}
#fxl .glw{background:radial-gradient(circle at center,#990519 0,rgba(153,5,25,.4) 120px,transparent 260px)}
#fxl .iris{inset:auto;left:50%;top:50%;opacity:1;border-radius:50%;box-shadow:0 0 0 400vmax #000;transform:translate(-50%,-50%)}

/* ---- 詳細ウィンドウ ---- */
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,2,10,.8)}
.modal[hidden]{display:none}
.mbox{position:relative;width:860px;max-width:calc(100% - 60px);background:#120a22;padding:64px 34px 24px;
  clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,30px 100%,0 calc(100% - 30px));
  box-shadow:inset 0 0 0 1px rgba(5,217,232,.6),0 0 40px rgba(5,217,232,.18)}
.mbox.mag{box-shadow:inset 0 0 0 1px rgba(255,61,127,.6),0 0 40px rgba(255,61,127,.18)}
.mx{display:inline-flex;align-items:center;position:absolute;right:40px;top:18px;font-size:14px;font-weight:700;color:var(--sub);border:1px solid var(--rule);padding:4px 12px;background:none;font-family:var(--jp)}
.mtimer{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.mlab{font-size:12px;font-weight:700;color:var(--faint);margin-bottom:4px}
/* ニュース詳細 */
.nd{display:grid;grid-template-columns:1fr 200px;column-gap:28px}
.nd .meta{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--sub);font-weight:700;margin-bottom:12px}
.nd .meta .tg{font-size:12px;border:1px solid var(--rule);padding:1px 8px}
.nd h2{font-size:28px;font-weight:900;line-height:1.4;margin-bottom:14px}
.nd .img{width:100%;height:240px;object-fit:cover;margin-bottom:14px;background:#000}
.nd .sum{font-size:19px;line-height:1.75;color:#d8e6f3}
.nd .by{font-size:13px;color:var(--faint);margin-top:12px}
.qrbox{align-self:end;text-align:center}
.qrbox .qr{background:#fff;padding:10px;width:200px;height:200px}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox p{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
/* 占い詳細 */
.fd{display:grid;grid-template-columns:1fr 250px;column-gap:30px}
.fd .hd{display:flex;align-items:center;gap:18px}
.fd .gl{font-size:64px;line-height:1;color:var(--yel);font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp)}
.fd .nm{font-size:30px;font-weight:900}
.fd .rk{margin-left:auto;font-family:var(--num);font-weight:800;font-size:72px;line-height:1}
.fd .rk span{font-family:var(--mono);font-size:18px;color:var(--faint);margin-left:4px}
.fd .rk.top{color:var(--yel);text-shadow:0 0 14px rgba(249,240,2,.45)}
.fd .msg{font-size:22px;font-weight:900;line-height:1.6;margin:18px 0 16px;padding:12px 16px;border-left:3px solid var(--mag);background:rgba(255,61,127,.06)}
.fd .rows{display:grid;gap:10px}
.fd .row{display:grid;grid-template-columns:60px 120px 1fr;align-items:center;font-size:16px}
.fd .row b{font-weight:900}
.fd .row .dm{display:flex;gap:5px}
.fd .row .dm i{width:12px;height:12px;transform:rotate(45deg);background:rgba(255,255,255,.12)}
.fd .row .dm i.on{background:var(--mag);box-shadow:0 0 6px rgba(255,61,127,.7)}
.fd .row span{color:#d8e6f3}
.fd .lucky{display:flex;gap:30px;margin-top:16px;font-size:18px;font-weight:900}
.fd .lucky .co{display:flex;align-items:center;gap:8px}
.fd .lucky .co i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.fd{grid-template-columns:1fr 300px}
.fd .side{border-left:1px solid var(--rule);padding-left:24px;min-width:0}
.fd .side .mlab{margin-bottom:8px}
.fd .side .hint{font-size:11px;color:var(--faint);margin-top:8px}
.rs{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rs:active{background:rgba(5,217,232,.12)}
/* 案A：ランキング＋総合運バー */
.sa .rs{display:grid;grid-template-columns:30px 22px 1fr 84px;align-items:center;height:30px;font-size:15px;color:var(--sub);border-bottom:1px dashed rgba(5,217,232,.1)}
.sa .rs b{font-family:var(--num);font-weight:600;color:var(--faint);font-size:14px}
.sa .rs .g{font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp);color:var(--cyan);font-size:16px}
.sa .rs .bar{height:6px;background:rgba(255,255,255,.07);position:relative}
.sa .rs .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.5)}
.sa .rs.mine{color:var(--text);font-weight:700}
.sa .rs.me{color:var(--yel);font-weight:900;background:rgba(249,240,2,.07)}
.sa .rs.me b,.sa .rs.me .g{color:var(--yel)}
.sa .rs.me .bar i{background:var(--yel);box-shadow:0 0 6px rgba(249,240,2,.6)}
/* 案B：12星座タイル */
.sb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sb .rs{position:relative;text-align:center;padding:8px 2px 7px;background:rgba(255,255,255,.035);border:1px solid rgba(5,217,232,.14)}
.sb .rs .g{display:block;font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp);font-size:24px;line-height:1.1;color:var(--cyan)}
.sb .rs .n{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:3px;white-space:nowrap}
.sb .rs b{position:absolute;right:4px;top:3px;font-family:var(--num);font-size:11px;color:var(--faint)}
.sb .rs.top3 b{color:var(--yel)}
.sb .rs.mine{border-color:rgba(255,255,255,.35)}
.sb .rs.mine .n{color:var(--text)}
.sb .rs.me{border-color:var(--yel);background:rgba(249,240,2,.1);box-shadow:0 0 12px rgba(249,240,2,.25)}
.sb .rs.me .g,.sb .rs.me .n{color:var(--yel)}
/* タイルの追加要素（案ごとに出し分け） */
.sb .rs .m,.sb .rs .big,.sb .rs .cd{display:none}
/* P2：タイル＋順位メーター */
.sb.v-meter .rs{padding-bottom:9px}
.sb.v-meter .rs .m{display:block;height:4px;margin:6px 8px 0;background:rgba(255,255,255,.08);position:relative}
.sb.v-meter .rs .m i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 5px rgba(5,217,232,.6)}

/* 長い文字は改行せず、枠に収まる大きさにする。
   まず文字数から大きさを決め（書体の読み込みに左右されない）、念のため実寸でも確認して縮める */
function shrinkToFit(sel, min) {
  document.querySelectorAll(sel).forEach((el) => {
    const w = el.clientWidth;
    if (!w) return;
    const units = [...el.textContent].reduce((n, c) => n + (/[\u0000-\u00ff]/.test(c) ? 0.6 : 1.04), 0);
    let fs = Math.max(min, Math.min(19, Math.floor((w / units) * 2) / 2));
    el.style.fontSize = fs + "px";
    while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 0.5; el.style.fontSize = fs + "px"; }
  });
}

// 配信からの経過時間（「25分前」「3時間前」「2日前」）
function ago(t) {
  const m = Math.max(0, Math.floor((Date.now() - t) / 60e3));
  return m < 60 ? `${m}分前` : m < 1440 ? `${Math.floor(m / 60)}時間前` : `${Math.floor(m / 1440)}日前`;
}

let mktAt = "", mkt = null;
const yen = (v, dig) => v == null || isNaN(v) ? "--" : Number(v).toLocaleString("ja-JP", { minimumFractionDigits: dig, maximumFractionDigits: dig });
function pct(v) {
  if (v == null || isNaN(v)) return `<span class="pc na">--</span>`;
  const up = v > 0.005, dn = v < -0.005;
  return `<span class="pc ${up ? "up" : dn ? "dn" : "na"}">${up ? `<svg class="tri" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9.2 8.5H.8z" fill="currentColor"/></svg>` : dn ? `<svg class="tri" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 8.5 .8 1.5h8.4z" fill="currentColor"/></svg>` : ""}${Math.abs(v).toFixed(2)}%</span>`;
}
const marketStyle = (new URLSearchParams(location.search).get("mv") || CONFIG.marketStyle || "b1").toLowerCase();
// 小さな折れ線グラフ（値の並びから描く）。上がっていればピンク、下がっていれば水色
function spark(arr, w, h) {
  const a = (arr || []).filter((v) => v != null && !isNaN(v));
  if (a.length < 2) return `<svg class="sp" viewBox="0 0 ${w} ${h}"></svg>`;
  const lo = Math.min(...a), hi = Math.max(...a), rg = hi - lo || 1;
  const pts = a.map((v, i) => `${(i / (a.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - (v - lo) / rg * (h - 4)).toFixed(1)}`).join(" ");
  const col = a[a.length - 1] >= a[0] ? "var(--mag)" : "var(--cyan)";
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function marketItems() {
  const fx = mkt.fx, coins = mkt.coins || [], dig = (c) => c.price >= 10000 ? 0 : 2;
  const out = [];
  if (fx) {
    out.push({ g: "為替", nm: "ドル/円", sym: "USD", v: yen(fx.usdjpy, 2), yen: false, ch: fx.usdChange, hist: fx.usdHist });
    out.push({ g: "為替", nm: "ユーロ/円", sym: "EUR", v: yen(fx.eurjpy, 2), yen: false, ch: fx.eurChange, hist: fx.eurHist });
  }
  coins.forEach((c) => out.push({ g: "暗号", nm: c.name, sym: c.sym, v: yen(c.price, dig(c)), yen: true, ch: c.change, hist: c.hist }));
  return out;
}
let ledTimer = null, ledIdx = 0;
// 流れる速さをそろえる（中身の長さに合わせて1周の時間を決める。1秒に約55px）
function ledSpeed() {
  document.querySelectorAll("#mkt .run").forEach((r) => { const w = r.scrollWidth / 2; r.style.animationDuration = Math.max(8, w / 55) + "s"; });
}
function renderLed() {
  const el = $("mkt"), items = marketItems(), fx = mkt.fx;
  const fxDate = fx ? (([, m, d]) => `${+m}/${+d}`)(fx.date.split("-")) : "";
  const one = (x) => `<span class="it"><em>${esc(x.g === "為替" ? x.nm : x.sym)}</em>${x.yen ? "¥" : ""}${x.v}${pct(x.ch)}</span>`;
  const loop = (list, minN) => { let a = list.slice(); while (a.length < minN) a = a.concat(list); const h = a.map(one).join(`<span class="sep">◆</span>`) + `<span class="sep">◆</span>`; return h + h; };
  const fxs = items.filter((x) => x.g === "為替"), cos = items.filter((x) => x.g !== "為替");
  const info = `<div class="ledinfo"><span>為替：${fxDate}の公表値・前日比</span><span>暗号資産：bitFlyer・24時間比</span></div>`;
  clearInterval(ledTimer);
  if (marketStyle === "b1") {
    el.innerHTML = `<div class="led"><span class="lbl">為替<small>${fxDate}</small></span><div class="run">${loop(fxs, 4)}</div></div>
      <div class="led"><span class="lbl">暗号資産</span><div class="run">${loop(cos, 3)}</div></div>`;
  } else if (marketStyle === "b2") {
    el.innerHTML = `<div class="led"><span class="lbl">為替<small>${fxDate}</small></span><div class="fix">${fxs.map(one).join("")}</div></div>
      <div class="led"><span class="lbl">暗号資産</span><div class="run">${loop(cos, 3)}</div></div>`;
  } else if (marketStyle === "b3") {
    el.innerHTML = `<div class="led"><span class="lbl">相場</span><div class="run">${loop(items, 5)}</div></div>${info}`;
  } else {
    const show = () => {
      const x = items[ledIdx % items.length];
      const box = el.querySelector(".one"); if (!box) return;
      box.innerHTML = one(x);
      el.querySelector(".lbl").innerHTML = x.g === "為替" ? `為替<small>${fxDate}</small>` : `暗号資産<small>24時間</small>`;
      el.querySelectorAll(".pips i").forEach((p, j) => p.classList.toggle("on", j === ledIdx % items.length));
    };
    el.innerHTML = `<div class="led"><span class="lbl"></span><div class="one"></div></div><div class="pips">${items.map(() => "<i></i>").join("")}</div>${info}`;
    show();
    ledTimer = setInterval(() => { ledIdx++; show(); }, 3000);
  }
  ledSpeed();
}

  if (marketStyle.startsWith("b") && marketStyle.length === 2) { $("mkt").className = "mv-" + marketStyle; renderLed(); return; }
  const el = $("mkt"), items = marketItems(), fx = mkt.fx;

  }
}

function mdOf(d) { return `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function renderToday() {
  const now = new Date(), md = mdOf(now), el = $("todayBox"); if (!el) return;
  const cls = { 誕生日: "b", 作中: "s" };
  const row = (x, extra = "") => `<div class="r"><span class="lb ${cls[x[1]] || ""}">${x[1]}</span><span class="yr">${x[2] || ""}</span><span class="tx">${esc(x[3])}</span>${extra}</div>`;
  const today = OTAKU_DAYS.filter((x) => x[0] === md);
  if (today.length) {
    // 4件まで表示。多い日は時間で入れ替え
    const page = Math.floor(Date.now() / 10e3) % Math.ceil(today.length / 4);
    el.innerHTML = today.slice(page * 4, page * 4 + 4).map((x) => row(x)).join("");
  } else {
    // 今日に該当がない日は、近い日の予定を出す
    const up = [];
    for (let k = 1; k <= 366 && up.length < 3; k++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k), m2 = mdOf(d);
      OTAKU_DAYS.filter((x) => x[0] === m2).forEach((x) => { if (up.length < 3) up.push([x, k, d]); });
    }
    el.innerHTML = `<div class="none">今日にあたる記念日はありません。近いのは…</div>` +
      up.map(([x, k, d]) => row(x, `<span class="ak">${d.getMonth() + 1}/${d.getDate()}<small>あと${k}日</small></span>`)).join("");
  }
}

/* 左右スワイプ（左へ＝次、右へ＝前）。指に少しついてくる */
function attachSwipe(box, getEl, onSwipe) {
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false, horiz = false, swallowClick = false;
  const begin = (x, y) => { sx = x; sy = y; dx = dy = 0; active = true; horiz = false; };
  const move = (x, y) => {
    if (!active) return;
    dx = x - sx; dy = y - sy;
    if (!horiz && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) horiz = true;
    if (horiz) {
      const el = getEl(); if (!el) return;
      el.style.transition = "none";
      el.style.transform = `translateX(${(dx / stageScale) * 0.35}px)`;
      el.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / stageScale / 700));
    }
  };
  const end = () => {
    if (!active) return; active = false;
    const el = getEl(); if (el) { el.style.transition = ""; el.style.transform = ""; el.style.opacity = ""; }
    if (!horiz) return;
    swallowClick = true; setTimeout(() => (swallowClick = false), 400);
    if (Math.abs(dx) / stageScale > 60) onSwipe(dx < 0 ? 1 : -1);
  };
  box.addEventListener("touchstart", (e) => { const t = e.touches[0]; begin(t.clientX, t.clientY); }, { passive: true });
  box.addEventListener("touchmove", (e) => { const t = e.touches[0]; move(t.clientX, t.clientY); if (horiz) e.preventDefault(); }, { passive: false });
  box.addEventListener("touchend", end);
  box.addEventListener("touchcancel", end);
  box.addEventListener("mousedown", (e) => begin(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => { if (active) move(e.clientX, e.clientY); });
  window.addEventListener("mouseup", end);
  // スワイプした指を離したときの「タップ」は無視（詳細などが開かないように）
  box.addEventListener("click", (e) => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);
}

    for (let d = 1; d <= 31; d++) {

      const k = `${Y}-${pad(m + 1)}-${pad(d)}`;

    <div class="cal">${cal}</div>
    <div class="ft"><div class="lg"><span><i style="background:rgba(5,217,232,.32)"></i>過ぎた日</span><span><i style="background:#fff"></i>今日</span><span><i style="border:1px solid var(--cyan)"></i>祝日</span><span><i style="background:var(--mag)"></i>イベント</span></div>

}

  {"g": "アニメ", "q": "『カウボーイビバップ』でスパイクが乗る小型の戦闘機は？", "a": ["ソードフィッシュII", "レッドテイル", "ハンマーヘッド", "ビバップ号"], "k": "スパイクの愛機。レッドテイルはフェイ、ハンマーヘッドはジェットの機体。ビバップ号は一行が暮らす宇宙船。"},

  {"g": "アニメ", "q": "『月刊少女野崎くん』で野崎梅太郎の正体は？", "a": ["少女漫画家", "小説家", "アイドル", "イラストレーター"], "k": "2014年放送。佐倉千代が告白した相手・野崎は、ペンネーム「夢野咲子」の人気少女漫画家だった。"},

  {"g": "アニメ", "q": "『クレしん オトナ帝国の逆襲』で大人たちを夢中にさせるのは？", "a": ["懐かしいにおい", "大量のお菓子", "新しいゲーム", "宇宙からの音楽"], "k": "2001年公開。20世紀の懐かしいにおいで大人たちが子どもに戻ってしまう。映画ファンの評価も高い作品。"},
  {"g": "アニメ", "q": "2005年からのアニメ『ドラえもん』でドラえもんの声を担当するのは？", "a": ["水田わさび", "大山のぶ代", "大原めぐみ", "かかずゆみ"], "k": "2005年に声優陣が一新された。のび太は大原めぐみ、しずかちゃんはかかずゆみが担当している。"},
  {"g": "アニメ", "q": "『ドキドキ！プリキュア』の主人公は？", "a": ["相田マナ", "愛乃めぐみ", "北条響", "桃園ラブ"], "k": "2013年放送。マナはキュアハートに変身する。愛乃めぐみは『ハピネスチャージ』、北条響は『スイート』の主人公。"},
  {"g": "アニメ", "q": "『フレッシュプリキュア！』で桃園ラブが変身するのは？", "a": ["キュアピーチ", "キュアベリー", "キュアパイン", "キュアパッション"], "k": "2009年放送。ダンスが大好きなラブがキュアピーチになる。ベリーは美希、パインはブッキー（祈里）。"},
  {"g": "アニメ", "q": "『スイートプリキュア♪』のテーマは？", "a": ["音楽", "ダンス", "お菓子", "宇宙"], "k": "2011年放送。北条響と南野奏が、音楽の力で伝説の楽譜を守る。キュアメロディとキュアリズムに変身する。"},
  {"g": "アニメ", "q": "『風立ちぬ』の主人公・堀越二郎の仕事は？", "a": ["飛行機の設計", "鉄道の運転", "船の建造", "自動車の開発"], "k": "2013年公開、宮崎駿監督。実在の零戦の設計者・堀越二郎がモデル。主人公の声は庵野秀明が担当した。"},
  {"g": "アニメ", "q": "『借りぐらしのアリエッティ』のアリエッティは何者？", "a": ["小人", "妖精", "魔女", "人形"], "k": "2010年公開。床下に住み、人間の物を少しずつ「借り」て暮らす小人の少女。"},
  {"g": "アニメ", "q": "『コクリコ坂から』の舞台の都市は？", "a": ["横浜", "神戸", "函館", "長崎"], "k": "2011年公開、宮崎吾朗監督。1963年の横浜を舞台に、高校生の海と俊の恋を描く。"},
  {"g": "アニメ", "q": "ジブリ映画『ゲド戦記』の監督は？", "a": ["宮崎吾朗", "宮崎駿", "高畑勲", "米林宏昌"], "k": "2006年公開。宮崎駿の長男・宮崎吾朗の監督第1作。原作はル＝グウィンのファンタジー小説。"},
  {"g": "アニメ", "q": "『かぐや姫の物語』の監督は？", "a": ["高畑勲", "宮崎駿", "宮崎吾朗", "細田守"], "k": "2013年公開。『竹取物語』を、水彩画のようなやわらかな絵で描いた。高畑勲の最後の監督作品になった。"},
  {"g": "アニメ", "q": "『猫の恩返し』で主人公のハルが連れていかれる国は？", "a": ["猫の国", "妖精の国", "海の底の国", "雲の上の国"], "k": "2002年公開。『耳をすませば』に登場した猫の人形バロンが、ハルを助けるために活躍する。"},
  {"g": "アニメ", "q": "『ONE PIECE』でゾロの夢は？", "a": ["世界一の大剣豪", "海賊王", "世界中の海を見る", "伝説の海賊を倒す"], "k": "幼なじみ・くいなとの約束で、世界一の剣豪を目指している。目標は「鷹の目」のミホーク。"},
  {"g": "アニメ", "q": "『ポケモン』でサトシのライバルだったオーキド博士の孫は？", "a": ["シゲル", "タケシ", "カスミ", "ケンジ"], "k": "シゲルはサトシと同じマサラタウン出身。タケシとカスミは旅の仲間で、それぞれジムリーダーだった。"},
  {"g": "アニメ", "q": "『名探偵コナン』で「西の高校生探偵」と呼ばれるのは？", "a": ["服部平次", "工藤新一", "白馬探", "京極真"], "k": "大阪弁を話す服部平次。「東の工藤、西の服部」と並び称される。白馬探も高校生探偵として登場する。"},
  {"g": "アニメ", "q": "『金田一少年の事件簿』で金田一の祖父は誰という設定？", "a": ["金田一耕助", "明智小五郎", "神津恭介", "浅見光彦"], "k": "横溝正史の小説に出てくる名探偵・金田一耕助が祖父という設定。決めゼリフ「じっちゃんの名にかけて」の由来。"},
  {"g": "アニメ", "q": "『犬夜叉』で犬夜叉の首にかけられた数珠の役目は？", "a": ["言霊で動きを封じる", "魔力を高める", "姿を消す", "病気を治す"], "k": "かごめが「おすわり」と言うと、数珠の力で犬夜叉は地面にたたきつけられる。"},
  {"g": "アニメ", "q": "『ちはやふる』で千早の幼なじみ2人は？", "a": ["太一と新", "奉太郎と里志", "竜児と北村", "公生と渡"], "k": "真島太一と綿谷新。小学生のころに3人で競技かるたを始めた。"},
  {"g": "アニメ", "q": "『四月は君の嘘』で宮園かをりが弾く楽器は？", "a": ["バイオリン", "ピアノ", "フルート", "チェロ"], "k": "自由で型破りな演奏をするバイオリニスト。公生は彼女の伴奏者として、再びピアノに向き合う。"},
  {"g": "アニメ", "q": "『魔法少女リリカルなのは』でフェイトの使い魔のオオカミは？", "a": ["アルフ", "ユーノ", "ザフィーラ", "リニス"], "k": "アルフはフェイトを守る狼の使い魔。ユーノはフェレットの姿の少年。ザフィーラは八神はやてを守る守護獣。"},
  {"g": "アニメ", "q": "『とある魔術の禁書目録』でインデックスが所属する教会は？", "a": ["イギリス清教", "ローマ正教", "ロシア成教", "天草式"], "k": "インデックスはイギリス清教の「必要悪の教会（ネセサリウス）」に所属するシスター。"},
  {"g": "アニメ", "q": "『Angel Beats!』で主人公の音無結弦が最初に失っていたものは？", "a": ["生前の記憶", "名前", "声", "右手"], "k": "音無は死後の世界に来たとき、生前の記憶を失っていた。記憶を取り戻すことが物語の鍵になる。"},
  {"g": "アニメ", "q": "『STEINS;GATE』で椎名まゆりの口ぐせは？", "a": ["トゥットゥルー", "にゃんぱすー", "はわわ", "にぱー"], "k": "「トゥットゥルー♪ まゆしぃ☆です」があいさつ。岡部の幼なじみで、ラボメン No.002。"},
  {"g": "ギャルゲ", "q": "『ToHeart2』で向坂環のあだ名は？", "a": ["タマ姉", "環ちゃん", "お嬢", "姉御"], "k": "主人公・河野貴明の幼なじみのお姉さん。弟の向坂雄二は貴明の親友。PS2版は2004年に発売された。"},
  {"g": "ギャルゲ", "q": "『To Heart』でうわさ話を広めるのが得意なヒロインは？", "a": ["長岡志保", "神岸あかり", "保科智子", "来栖川綾香"], "k": "「志保ちゃん情報」として学校のうわさを広める。神岸あかりは主人公・藤田浩之の幼なじみ。"},
  {"g": "ギャルゲ", "q": "『To Heart』で超能力に悩む後輩のヒロインは？", "a": ["姫川琴音", "松原葵", "雛山理緒", "宮内レミィ"], "k": "琴音は自分の超能力を不吉なものだと思い込み、人を避けている。松原葵は格闘技に打ち込む後輩。"},
  {"g": "ギャルゲ", "q": "『To Heart』で格闘技に打ち込む後輩は？", "a": ["松原葵", "姫川琴音", "来栖川芹香", "マルチ"], "k": "葵は総合格闘技「エクストリーム」を目指して練習している。来栖川芹香の妹・綾香は葵のあこがれの選手。"},
  {"g": "ギャルゲ", "q": "『To Heart』でアメリカ人とのハーフのヒロインは？", "a": ["宮内レミィ", "保科智子", "長岡志保", "セリオ"], "k": "レミィは明るく弓道が得意な帰国子女。日本語の言い間違いもかわいらしい。"},
  {"g": "ギャルゲ", "q": "『WHITE ALBUM』（1998年）で森川由綺のライバルのアイドルは？", "a": ["緒方理奈", "篠塚弥生", "河島はるか", "観月マナ"], "k": "緒方理奈はトップアイドル。篠塚弥生は由綺のマネージャー、河島はるかは主人公の幼なじみ。"},
  {"g": "ギャルゲ", "q": "『WHITE ALBUM2』で学園祭のバンドに加わるアイドル的存在の少女は？", "a": ["小木曽雪菜", "冬馬かずさ", "杉浦小春", "和泉千晶"], "k": "「峰城大付属のアイドル」と呼ばれる雪菜。春希、かずさとの3人で学園祭のステージに立つ。"},
  {"g": "ギャルゲ", "q": "『WHITE ALBUM2』を開発したブランドは？", "a": ["Leaf", "Key", "âge", "TYPE-MOON"], "k": "アクアプラスのブランドLeafの作品。1998年の『WHITE ALBUM』とは登場人物が異なる、新しい物語。"},
  {"g": "ギャルゲ", "q": "『こみっくパーティー』で主人公を同人の道に引き込む親友は？", "a": ["九品仏大志", "千堂和樹", "高瀬瑞希", "大庭詠美"], "k": "主人公・千堂和樹は、オタクの親友・大志に誘われて同人誌作りを始める。瑞希は和樹の幼なじみ。"},
  {"g": "ギャルゲ", "q": "『こみパ』で主人公の幼なじみのヒロインは？", "a": ["高瀬瑞希", "大庭詠美", "猪名川由宇", "塚本千紗"], "k": "瑞希はオタク嫌いのテニス部員。大庭詠美は人気の同人作家で、猪名川由宇は関西弁の同人作家。"},
  {"g": "ギャルゲ", "q": "『うたわれるもの』でハクオロを助けた村の薬師の少女は？", "a": ["エルルゥ", "アルルゥ", "カミュ", "トウカ"], "k": "記憶を失ったハクオロを看病した少女。妹のアルルゥは森の主の子ども・ムックルと仲良し。"},
  {"g": "ギャルゲ", "q": "『うたわれるもの』でハクオロがつけているものは？", "a": ["仮面", "眼帯", "手甲", "兜"], "k": "顔の上半分をおおう仮面は、外すことができない。物語が進むと仮面の秘密が明らかになる。"},
  {"g": "ギャルゲ", "q": "『AIR』で霧島佳乃が手首に巻いているものは？", "a": ["黄色いバンダナ", "赤いリボン", "数珠", "腕時計"], "k": "佳乃は手首の黄色いバンダナを絶対に外さない。姉の霧島聖は町の診療所の医者。"},
  {"g": "ギャルゲ", "q": "『AIR』で霧島佳乃の飼っている犬のような生き物は？", "a": ["ポテト", "ムックル", "ぴろ", "ボコ"], "k": "「ぴこぴこ」と鳴く白い生き物。ぴろは『Kanon』で沢渡真琴が連れていた猫。"},
  {"g": "ギャルゲ", "q": "『CLANNAD』で図書室にいる天才少女は？", "a": ["一ノ瀬ことみ", "伊吹風子", "藤林椋", "宮沢有紀寧"], "k": "「ひらがな3つで、ことみ。呼ぶときは、ことみちゃん」と自己紹介する。授業に出ず図書室で本を読んでいる。"},
  {"g": "ギャルゲ", "q": "『CLANNAD』で主人公・岡崎朋也の悪友は？", "a": ["春原陽平", "古河秋生", "芳野祐介", "相楽美佐枝"], "k": "春原はサッカー部をやめた不良仲間。いつも朋也に振り回され、ひどい目にあう。"},
  {"g": "ギャルゲ", "q": "『CLANNAD』で古河渚の父・秋生が好きなスポーツは？", "a": ["野球", "サッカー", "バスケ", "ラグビー"], "k": "秋生は元劇団員で、パン屋の主人。近所の子どもと野球をするのが大好き。"},
  {"g": "ギャルゲ", "q": "『CLANNAD』の後半、社会人になった朋也を描く章は？", "a": ["AFTER STORY", "SUMMER", "Heaven's Feel", "Refrain"], "k": "渚と結婚し、娘の汐が生まれたあとの物語。アニメでは第2期『CLANNAD 〜AFTER STORY〜』として描かれた。"},
  {"g": "ギャルゲ", "q": "『リトルバスターズ！』で剣道部に所属するメンバーは？", "a": ["宮沢謙吾", "井ノ原真人", "棗恭介", "直枝理樹"], "k": "謙吾は剣道部のエース。真人は筋肉が自慢で、謙吾とはいつもケンカしている。恭介はリトルバスターズのリーダー。"},
  {"g": "ギャルゲ", "q": "『リトバス』で筋肉が自慢のメンバーは？", "a": ["井ノ原真人", "宮沢謙吾", "棗恭介", "直枝理樹"], "k": "真人は筋トレが大好きで、何かにつけ「筋肉」を持ち出す。好物はカツ。"},
  {"g": "ギャルゲ", "q": "『リトバス』でお菓子が大好きなヒロインは？", "a": ["神北小毬", "来ヶ谷唯湖", "西園美魚", "三枝葉留佳"], "k": "小毬は甘いお菓子をいつも持ち歩き、口ぐせは「ふえぇ」。西園美魚はいつも日傘をさしている。"},
  {"g": "ギャルゲ", "q": "『リトバス』でいつも日傘をさしている物静かなヒロインは？", "a": ["西園美魚", "神北小毬", "能美クドリャフカ", "笹瀬川佐々美"], "k": "美魚は体が弱いとされ、日傘を手放さない。本を読むのが大好き。"},
  {"g": "ギャルゲ", "q": "『Rewrite』で怪力の持ち主のヒロインは？", "a": ["鳳ちはや", "此花ルチア", "神戸小鳥", "千里朱音"], "k": "ちはやは小柄だが怪力。此花ルチアは潔癖症の風紀委員、千里朱音はオカルト研究会の部長。"},
  {"g": "ギャルゲ", "q": "『planetarian』の主人公の仕事は？", "a": ["屑屋", "郵便配達", "探偵", "医者"], "k": "戦争で荒れた世界で、廃墟から使える物を集めて回る「屑屋」。廃墟のプラネタリウムでロボットのゆめみに出会う。"},
  {"g": "ギャルゲ", "q": "『月姫』で遠野家に仕える双子のメイドの姉は？", "a": ["琥珀", "翡翠", "秋葉", "シエル"], "k": "琥珀が姉、翡翠が妹の双子。琥珀は明るい割烹着姿、翡翠は無口なメイド服姿で働いている。"},
  {"g": "ギャルゲ", "q": "『月姫』で遠野志貴がかけているメガネの役割は？", "a": ["魔眼を抑える", "視力を上げる", "霊を見る", "正体を隠す"], "k": "「魔眼殺し」のメガネで、物の「死の線」が見える直死の魔眼を抑えている。魔法使いの蒼崎青子からもらった。"},
  {"g": "ギャルゲ", "q": "『月姫』で志貴に好意を寄せる同級生の少女は？", "a": ["弓塚さつき", "遠野秋葉", "シエル", "翡翠"], "k": "弓塚さつきはクラスメイト。『月姫』のPC版では攻略できないヒロインとして知られ、ファンの人気も高い。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』で聖杯戦争の監督役の神父は？", "a": ["言峰綺礼", "間桐臓硯", "衛宮切嗣", "葛木宗一郎"], "k": "言峰綺礼は冬木の教会の神父で、凛の兄弟子。間桐臓硯は桜の祖父にあたる魔術師。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』でセイバーの真名は？", "a": ["アルトリア", "ジャンヌ", "ネロ", "モードレッド"], "k": "セイバーの正体はアーサー王で、名前はアルトリア・ペンドラゴン。女性であることを隠して王になった。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』でライダーの正体は？", "a": ["メドゥーサ", "メディア", "ヘラクレス", "ギルガメッシュ"], "k": "ライダーはギリシャ神話のメドゥーサ。メディアはキャスター、ヘラクレスはバーサーカーの正体。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』でバーサーカーの正体は？", "a": ["ヘラクレス", "アキレウス", "ペルセウス", "ベオウルフ"], "k": "イリヤのサーヴァント。12の試練を越えた英雄で、宝具「十二の試練」で何度もよみがえる。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』でアサシンとして呼ばれた剣士は？", "a": ["佐々木小次郎", "宮本武蔵", "柳生十兵衛", "沖田総司"], "k": "キャスターに呼ばれた特殊なアサシン。山門を守り、秘剣「燕返し」を使う。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』で遠坂凛がヒロインのルートは？", "a": ["Unlimited Blade Works", "Heaven's Feel", "Fate", "Realta Nua"], "k": "3つのルートは「Fate」「Unlimited Blade Works」「Heaven's Feel」。順番にセイバー、凛、桜がヒロインになる。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』で衛宮士郎が得意とする魔術は？", "a": ["投影", "召喚", "治癒", "変身"], "k": "物の形を写し取って作り出す「投影」。見た剣を写し取り、戦いの中で自分の武器にしていく。"},
  {"g": "ギャルゲ", "q": "『Fate/stay night』の続編のファンディスク（2005年）は？", "a": ["Fate/hollow ataraxia", "Fate/Zero", "Fate/EXTRA", "Fate/Apocrypha"], "k": "聖杯戦争のあとの日常を描くファンディスク。『Fate/Zero』は虚淵玄による前日譚の小説。"},
  {"g": "ギャルゲ", "q": "『空の境界』で両儀式の同級生で、彼女を気にかける青年は？", "a": ["黒桐幹也", "遠野志貴", "衛宮士郎", "蒼崎橙子"], "k": "幹也は人探しが得意な青年。蒼崎橙子は人形師の魔術師で、幹也と式の雇い主。"},
  {"g": "ギャルゲ", "q": "『魔法使いの夜』で山から街に出てきた少年は？", "a": ["静希草十郎", "衛宮士郎", "遠野志貴", "岡崎朋也"], "k": "2012年発売。蒼崎青子と久遠寺有珠という2人の魔法使いの屋敷に、草十郎が住むことになる。"},
  {"g": "ギャルゲ", "q": "『Phantom』でツヴァイを暗殺者に育てた少女のコードネームは？", "a": ["アイン", "ドライ", "キャル", "クロウディア"], "k": "組織「インフェルノ」の暗殺者アイン。ツヴァイこと吾妻玲二は彼女に暗殺の技術を叩き込まれる。"},

  {"g": "ギャルゲ", "q": "『処女はお姉さまに恋してる』で主人公の宮小路瑞穂がすることは？", "a": ["女装して女子校に通う", "男装して男子校に通う", "アイドルになる", "メイドとして働く"], "k": "2005年発売。祖父の遺言で、瑞穂は女装してお嬢様学校に転入する。のちに「エルダー」に選ばれる。"},

  {"g": "ギャルゲ", "q": "『Kanon』で主人公・相沢祐一が居候する家は？", "a": ["水瀬家", "美坂家", "倉田家", "月宮家"], "k": "祐一は7年ぶりに訪れた雪の町で、叔母の秋子さんといとこの名雪が住む水瀬家に居候する。"},
  {"g": "ギャルゲ", "q": "『Kanon』を発表した、Keyとして最初の作品は？", "a": ["Kanon", "AIR", "ONE", "CLANNAD"], "k": "Keyはビジュアルアーツのブランド。『ONE』を作ったTacticsのスタッフが中心となって立ち上げた。"},

  {"g": "ギャルゲ", "q": "『AIR』で神尾観鈴と暮らす、母親代わりの叔母は？", "a": ["神尾晴子", "霧島聖", "遠野美凪", "水瀬秋子"], "k": "晴子はお酒好きで豪快な性格。観鈴とのぎこちない関係が、物語の後半で大きく描かれる。"},
  {"g": "ギャルゲ", "q": "TYPE-MOONの前身となった同人サークルの名前は？", "a": ["竹箒", "07th Expansion", "Tactics", "上海アリス幻樂団"], "k": "奈須きのこ、武内崇たちの同人サークル。『月姫』はこの竹箒から2000年に同人ソフトとして出た。"},
  {"g": "ギャルゲ", "q": "『ひぐらしのなく頃に』の作者は？", "a": ["竜騎士07", "奈須きのこ", "麻枝准", "虚淵玄"], "k": "07th Expansionの代表。シナリオだけでなく、独特なキャラクターの絵も自分で描いていた。"},

  {"g": "ギャルゲ", "q": "『月姫』でシエル先輩が所属する組織は？", "a": ["埋葬機関", "魔術協会", "聖堂教会の騎士団", "ネルフ"], "k": "聖堂教会の中でも最強の異端狩りの部署「埋葬機関」の第七位。カレーが大好き。"},

  {"g": "ラノベ", "q": "『魔術士オーフェン』でオーフェンが最初にしていた仕事は？", "a": ["もぐりの金貸し", "宮廷魔術士", "賞金稼ぎ", "傭兵"], "k": "オーフェンはトトカンタの街でもぐりの金貸しをしていた。借金を返さない地人の兄弟ボルカンとドーチンに手を焼く。"},

// ぷちゅん：画面が止まってずれる → 一瞬で消える → 無音の暗闇 → 白黒反転が4回チカッ → 白に「20 COMBO」 → ジェネレーターへ
function puchun() {
  GAME.busy = true;
  if (!$("modal").hidden) { onModalClose = null; closeModal(); }
  const f = document.createElement("div"); f.id = "pz";
  f.innerHTML = `<div class="inv"></div><div class="blk"></div><div class="line"></div><div class="wf"></div><div class="big"><b>${GAME.combo}</b><span>COMBO</span></div>`;
  document.body.appendChild(f);
  const q = (x) => f.querySelector(x), fit = $("fit"), fv = $("fvr"), cut = 1.4;
  const flashes = [[4.0, 4.1], [4.6, 4.7], [5.1, 5.18], [5.35, 5.45]];
  let opened = false;
  playFx((T) => {
    if (T > .6 && fv && !fv.dataset.frozen) { fv.dataset.frozen = 1; try { fv.getAnimations({ subtree: true }).forEach((a) => a.pause()); } catch (e) {} }
    const dz = gcl((T - .6) / .8), fr = T > .6 && T < cut;
    fit.style.transform = fr ? `translateX(${4 + 16 * dz}px) skewX(${-dz * 3}deg)` : "";
    fit.style.filter = fr ? `saturate(${1 - dz * .8})` : "";
    const ln = q(".line"); ln.style.opacity = (T >= cut && T < cut + .14) ? 1 : 0; ln.style.transform = `scaleX(${1 - gcl((T - cut) / .14)})`;
    const on = flashes.some(([a, b]) => T >= a && T < b);
    q(".blk").style.opacity = T < cut ? 0 : (T < 6.0 ? (on ? 0 : 1) : 0);
    q(".inv").style.opacity = on ? 1 : 0;
    q(".wf").style.opacity = T < 6.0 ? 0 : T < 7.0 ? 1 : 1 - gcl((T - 7.0) / .3);
    const bg = q(".big"); bg.style.opacity = T >= 6.0 && T < 7.0 ? 1 : 0; bg.style.transform = `scale(${1.8 - .8 * gcl((T - 6.0) / .15)})`;
    f.style.transform = (T > 6.0 && T < 6.4) ? `translate(${Math.sin(T * 120) * 16}px,${Math.cos(T * 90) * 12}px)` : "";
    if (T >= 7.0 && !opened) { opened = true; feverEnd(true); genOpen(); }
    if (opened) { const g = $("gen"); g.style.transform = `scale(${.6 + .4 * gease((T - 7.0) / .45)})`; }
    return T < 7.5;
  }, () => { f.remove(); const g = $("gen"); if (g) g.style.transform = ""; GAME.busy = false; genNext(); });
}

// 100コンボでクリア：0→100のカウントアップ → 衝撃の輪と「PERFECT」 → 金色のオーラと金の粉 → 静かにボードへ戻る

  clearInterval(genTimer);
  const f = document.createElement("div"); f.id = "gend";
  const dust = Array.from({ length: 90 }, () => ({ x: Math.random() * innerWidth, sp: 60 + Math.random() * 110, sw: 10 + Math.random() * 30, ph: Math.random() * 6.28, d: Math.random() * 1.2, s: .5 + Math.random() * 1.1 }));
  f.innerHTML = `<div class="dim"></div><div class="aura"></div>${dust.map(() => '<i class="dust"></i>').join("")}<div class="rg"></div><div class="rg"></div>
    <div class="cnt"><em>PERFECT</em><b>0</b><small>COMBO</small></div><div class="shine"></div><div class="wf"></div><div class="ty">THANK YOU FOR PLAYING</div>`;
  document.body.appendChild(f);
  const q = (x) => f.querySelector(x), qa = (x) => [...f.querySelectorAll(x)], dEl = qa(".dust"), N = GM.clearAt, H = innerHeight;

    const n = T < .8 ? 0 : Math.round(N * (1 - (1 - gcl((T - .8) / 1.7)) ** 2));
    const c = q(".cnt"); c.style.opacity = T < .8 ? 0 : 1; c.querySelector("b").textContent = n;

    const em = c.querySelector("em"); em.style.opacity = gcl((T - 2.6) / .2); em.style.transform = `translateY(${30 * (1 - gease((T - 2.6) / .3))}px)`;

    q(".wf").style.opacity = T < 2.5 ? 0 : .9 * (1 - gcl((T - 2.5) / .35));
    f.style.transform = (T > 2.5 && T < 2.9) ? `translate(${Math.sin(T * 130) * 16 * (1 - (T - 2.5) / .4)}px,${Math.cos(T * 97) * 12 * (1 - (T - 2.5) / .4)}px)` : "";

    const m = gameMem(); gameSave({ clear: ymd(new Date()), clears: (m.clears || 0) + 1 });

}

const HID = Object.assign({ moveIn: "2024-08-10", countFromOne: false, taps: 5, idleCloseSec: 60 }, CONFIG.hidden || {});

function renderHidden() {
  const now = new Date(), [y, m, d] = HID.moveIn.split("-").map(Number), start = new Date(y, m - 1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

const easeS = (x) => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const pulseAt = (t, c, w) => Math.exp(-(((t - c) / w) ** 2));
// 演出：色が抜けて赤黒く沈む（鼓動3回）→ 暗転（赤い光が1回脈打つ）→ 闇が開くように現れる → 一瞬乱れる
function openHidden() {
  if (hidOpen || hidBusy) return;
  hidBuild(); hidFit(); renderHidden();
  if (!$("modal").hidden) closeModal();
  hidBusy = true; hidOpen = true;
  const fx = document.createElement("div"); fx.id = "fxl";
  fx.innerHTML = `<i class="tint"></i><i class="dark"></i><i class="glw"></i><i class="iris"></i>`;
  document.body.appendChild(fx);
  const [tint, dark, glw, iris] = fx.children, fit = $("fit"), hid = $("hid"), h2 = hid.querySelector(".h2");
  const R0 = Math.hypot(innerWidth, innerHeight) / 2;
  const setIris = (r) => {
    const R = Math.max(1, r * R0);
    iris.style.width = iris.style.height = 2 * R + "px";
    iris.style.background = `radial-gradient(circle closest-side,transparent ${Math.max(0, (r - .3) / r * 100).toFixed(1)}%,#000 100%)`;
  };
  let t0 = null, shown = false;
  const step = (now) => {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    if (t < 2.4) {
      const p = t / 2.4, pu = .55 * pulseAt(t, .6, .07) + .75 * pulseAt(t, 1.25, .08) + .95 * pulseAt(t, 1.9, .09);
      tint.style.opacity = (easeS(p) * .85).toFixed(3);
      dark.style.opacity = Math.max(0, .72 * p - .45 * pu).toFixed(3);
      fit.style.transform = pu > .01 ? `scale(${(1 + .018 * pu).toFixed(4)})` : "";
      setIris(1.25 - .97 * easeS(p));
    } else if (t < 3.2) {
      fit.style.transform = ""; tint.style.opacity = 0; dark.style.opacity = 1; iris.style.opacity = 0;
      glw.style.opacity = (.55 * pulseAt(t, 2.8, .1)).toFixed(3);
    } else if (t < 4.4) {
      if (!shown) { shown = true; hid.hidden = false; h2.classList.add("ghost"); glw.style.opacity = 0; iris.style.opacity = 1; }
      const q = easeS((t - 3.2) / 1.2);
      dark.style.opacity = (.65 * (1 - q)).toFixed(3);
      setIris(.05 + 1.3 * q);
      h2.style.filter = q < .99 ? `blur(${(16 * (1 - q)).toFixed(1)}px)` : "";
    } else {
      fx.remove(); fit.style.transform = ""; h2.style.filter = "";
      h2.classList.add("jit");
      setTimeout(() => h2.classList.remove("jit", "ghost"), 160);   // 乱れのあと、残像が0.5秒で消える
      hidBusy = false;
      hidTick = setInterval(renderHidden, 1000);
      hidIdle = setTimeout(closeHidden, HID.idleCloseSec * 1e3);
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function closeHidden() {

  const hid = $("hid"); hid.style.transition = "opacity .6s"; hid.style.opacity = "0";

$("time").addEventListener("click", (e) => {
  if (!e.target.closest(".sec")) return;
  const n = Date.now(); hidTaps = hidTaps.filter((x) => n - x < 2000); hidTaps.push(n);
  if (hidTaps.length >= HID.taps) { hidTaps = []; openHidden(); }
});

tick(); setInterval(tick, 1000);
renderClear();
loadHolidays().then(renderTrain);
setInterval(() => { if (holidaysLoadedOn !== ymd(new Date())) loadHolidays(); }, 10 * 60e3);
loadTrainStatus(); setInterval(loadTrainStatus, CONFIG.train.statusRefreshMin * 60e3);
renderFortune(); setInterval(renderFortune, 60e3);
showSlide(0); startSlides();
setInterval(() => { const k = slideOrder()[slideIdx]; if (k === "sky") renderSky(); if (k === "count") renderCount(); }, 60e3);
loadWeather(); setInterval(loadWeather, CONFIG.weatherRefreshMin * 60e3);
loadNews(); setInterval(loadNews, CONFIG.news.refreshMin * 60e3);
renderToday(); setInterval(() => { if (nOrder()[nIdx] === "today") renderToday(); }, 10e3);
showNews(0);
if (nOrder().includes("giga")) { loadGiga(); setInterval(loadGiga, CONFIG.news.refreshMin * 60e3); }
loadMarket(); setInterval(loadMarket, (CONFIG.marketRefreshMin || 3) * 60e3);
keepAwake();
window.addEventListener("online", () => { loadWeather(); loadTrainStatus(); loadNews(); if (nOrder().includes("giga")) loadGiga(); loadMarket(); });
if (document.fonts) document.fonts.ready.then(() => { fit(); shrinkToFit(".fc4 .it", 11); autoFit(); });
[1500, 5000].forEach((ms) => setTimeout(() => { shrinkToFit(".fc4 .it", 11); autoFit(); }, ms));
setInterval(autoFit, 60e3);
(function reloadLater() { setTimeout(function again() { if (gameBusy() || hidOpen) setTimeout(again, 60e3); else location.reload(); }, CONFIG.fullReloadHours * 3600e3); })();

/* ---------- 新しい版の自動反映 ----------
   GitHubのファイルを読み直し、下の BOARD_BUILD（版の印）が変わっていたらページを読み直す。
   詳細ウィンドウを開いている間は待つ */
const BOARD_BUILD = "20261104-1800";
async function checkUpdate() {
  try {
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const m = (await r.text()).match(/const BOARD_BUILD = "([^"]+)"/);
    if (m && m[1] !== BOARD_BUILD) {
      const go = () => { if ($("modal").hidden && !hidOpen && !gameBusy()) location.reload(); else setTimeout(go, 10e3); };
      go();
    }
  } catch (e) {}
}
setInterval(checkUpdate, (CONFIG.updateCheckMin || 5) * 60e3);
setTimeout(checkUpdate, 30e3);
</script>
