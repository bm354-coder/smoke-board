<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="喫煙所ボード">
<title>喫煙所ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap">
<style>
/* =========================================================
   喫煙所ボード（iPad常時表示用）— NEON
   画面は決まったサイズの1枚として作り、端末に合わせて丸ごと拡大縮小する
   ========================================================= */
:root{
  --bg:#07040f; --text:#eef9ff; --sub:#97abc4; --faint:#55658a; --rule:rgba(5,217,232,.28);
  --cyan:#05d9e8; --mag:#ff3d7f; --yel:#f9f002; --ok:#2ee6f2; --stop:#ff3d7f;
  --mono:"Share Tech Mono",ui-monospace,monospace; --num:"Orbitron",sans-serif; --jp:"Noto Sans JP","Hiragino Sans",sans-serif; --jph:var(--jp);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--text);font-family:var(--jp);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  background:
    radial-gradient(900px 520px at 100% -8%,rgba(255,61,127,.15),transparent 62%),
    radial-gradient(900px 520px at -6% 108%,rgba(5,217,232,.13),transparent 62%),
    linear-gradient(rgba(5,217,232,.04) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(5,217,232,.04) 1px,transparent 1px) 0 0/32px 100%,#07040f}
#fit{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:22px 26px 14px;display:grid}
#stage.land{width:1180px;height:780px;grid-template-columns:590px 1fr;column-gap:36px;grid-template-rows:1fr 14px;row-gap:8px;
  grid-template-areas:"L R" "foot foot"}
#stage.port{width:820px;height:1500px;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;row-gap:24px;
  grid-template-areas:"L" "R" "foot"}
.colL{grid-area:L;display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
.colR{grid-area:R;display:flex;flex-direction:column;gap:18px;min-height:0;min-width:0}
#stage.port .train{height:340px;flex:none}
#stage.port .fortune{height:400px;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* セクション見出し：番号＋英字＋日本語＋細い罫線 */
.sh{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--cyan);white-space:nowrap;margin-bottom:10px}
.sh .no{color:var(--faint)}
.sh .jp{font-family:var(--jph);font-weight:900;letter-spacing:.06em;color:var(--cyan);font-size:15px}
.sh .rl{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.sh .aux{color:var(--sub);font-family:var(--jp);font-size:12px;letter-spacing:.02em}

/* ---- 時計（枠なし） ---- */
.clock{display:flex;flex-direction:column;justify-content:flex-end;min-width:0;flex:none}
#time{font-family:var(--num);font-weight:800;font-size:108px;line-height:.9;letter-spacing:.01em;text-shadow:0 0 18px rgba(5,217,232,.45)}
#time .sec{font-size:34px;color:var(--mag);margin-left:10px;text-shadow:0 0 10px rgba(255,61,127,.6);vertical-align:.1em}
.dline{display:flex;align-items:baseline;gap:14px;margin-top:12px;white-space:nowrap}
#date{font-size:24px;font-weight:900;letter-spacing:.04em}
#dateEn{font-family:var(--mono);font-size:15px;color:var(--sub);letter-spacing:.2em}
#alerts{margin-top:8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;min-height:24px;color:var(--cyan)}
#alerts .a{margin-right:18px}
#alerts .a::before{content:"▲ ";font-size:12px}
#alerts .w{color:var(--yel)} #alerts .s{color:var(--mag)}

/* ---- 天気（いま・4日間・12時間をひとまとめ） ---- */
.wx{flex:none;display:flex;flex-direction:column;min-width:0}
.wtop{display:grid;grid-template-columns:1fr 268px;column-gap:14px;align-items:center}
.nrow{display:flex;align-items:center;gap:12px;min-width:0}
#nowIcon{font-size:52px;line-height:1}
#nowTemp{font-family:var(--num);font-weight:800;font-size:62px;line-height:1}
#nowTemp sup{font-size:.42em;vertical-align:.95em;margin-left:2px}
.ndesc{min-width:0}
.ndesc b{display:block;font-size:17px;font-weight:900;white-space:nowrap;margin-top:6px}
.ndesc span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-top:3px;white-space:nowrap}
.nstats{display:flex;justify-content:space-between;margin-top:10px;padding:7px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap}
.nstats div{font-size:13px;color:var(--sub);font-weight:700}
.nstats b{font-family:var(--num);font-size:18px;color:var(--text);margin-left:7px;font-weight:600}
.nstats b.hi{color:#ff7aa5} .nstats b.lo{color:#6fe6f2}
#days{display:grid;grid-template-columns:repeat(4,1fr)}
.day{text-align:center;font-size:13px;font-weight:700}
.day+.day{border-left:1px solid var(--rule)}
.day .i{font-size:22px;line-height:1.3}
.day .v{font-family:var(--num);font-size:13px;font-weight:600}
.day .hi{color:#ff7aa5} .day .lo{color:#6fe6f2}
.day .p{font-family:var(--mono);color:var(--cyan);font-size:12px;margin-top:1px}
.hlab{font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}
#hours{display:grid;grid-template-columns:repeat(12,1fr)}
.h{text-align:center}
.h .t{font-family:var(--mono);color:var(--sub);font-size:12px}
.h .i{font-size:19px;line-height:1.35}
.h .v{font-family:var(--num);font-size:13px;font-weight:600}
.h .bar{height:18px;display:flex;align-items:flex-end;justify-content:center;margin-top:3px}
.h .bar i{display:block;width:50%;background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.5)}
.h .p{font-family:var(--mono);font-size:11px;color:var(--cyan)}

/* ---- 電車（唯一の枠付きパネル＝主役） ---- */
.train{flex:1;position:relative;padding:14px 22px 12px;background:rgba(18,8,30,.82);min-height:0;display:flex;flex-direction:column;
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);
  box-shadow:inset 0 0 0 1px rgba(255,61,127,.55)}
.train::after{content:"";position:absolute;right:0;top:0;width:37px;height:1px;background:rgba(255,61,127,.55);transform-origin:right top;transform:rotate(45deg) translate(0,0);right:-1px}
.train .sh,.train .sh .jp{color:var(--mag)}
.train .sh .rl{background:linear-gradient(90deg,rgba(255,61,127,.35),transparent)}
.tline{display:flex;align-items:center;gap:10px;white-space:nowrap}
.smark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e5609a;color:#fff;font-family:var(--num);font-size:12px;font-weight:800}
#trainTitle{font-size:18px;font-weight:900}
#trainTitle small{font-size:14px;color:var(--sub);font-weight:700;margin-left:6px}
.status{margin-left:auto;font-size:15px;font-weight:700;padding:3px 12px;border:1px solid currentColor;color:var(--sub);white-space:nowrap}
.status::before{content:"● "}
.status.normal{color:var(--ok)} .status.delay{color:var(--yel);background:rgba(249,240,2,.1)} .status.stop{color:#fff;background:var(--stop);border-color:var(--stop)}
#statusDetail{font-size:13px;color:var(--yel);margin-top:5px;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{display:flex;align-items:flex-end;gap:18px;margin-top:8px;white-space:nowrap}
.cd .lab{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;min-height:18px}
#nextIn{font-family:var(--num);font-weight:800;font-size:96px;line-height:.9;color:var(--mag);text-shadow:0 0 16px rgba(255,61,127,.45)}
.train.has-detail #nextIn{font-size:78px}
.train.has-detail .cd{margin-top:4px}
#nextIn.soon{color:var(--yel);text-shadow:0 0 16px rgba(249,240,2,.5)}
#nextIn.txt{font-family:var(--jph);font-weight:900;font-size:44px;color:var(--text);text-shadow:none}
#nextAt{font-size:18px;color:var(--sub);font-weight:700;padding-bottom:6px}
#nextAt b{font-family:var(--num);font-size:30px;color:var(--text);font-weight:600;margin-right:4px}
#tBoard{margin-top:auto;padding-top:2px;border-top:1px solid rgba(255,61,127,.3)}
#tBoard .r{display:grid;grid-template-columns:110px 1fr auto;align-items:center;height:31px;border-bottom:1px dashed rgba(255,61,127,.18);font-size:20px}
#tBoard .r:last-child{border-bottom:none}
#tBoard .tm{font-family:var(--num);font-weight:600}
#tBoard .dst{font-size:15px;color:var(--sub);font-weight:700}
#tBoard .rm{font-family:var(--mono);font-size:20px;color:var(--cyan);letter-spacing:.06em}
#tBoard .rm::before{content:"T−";color:var(--faint);font-size:14px;margin-right:4px}
#tBoard .last .dst::after{content:"　終電";color:var(--yel)}

/* ---- 星座占い（枠なし・4列） ---- */
.fortune{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#fCols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);min-height:0}
.fc4{position:relative;padding:4px 10px 0 12px;display:flex;flex-direction:column;min-width:0}
.fc4+.fc4{border-left:1px solid var(--rule)}
.fc4 .gl{font-size:40px;line-height:1;color:var(--cyan);font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp)}
.fc4 .nm{font-size:19px;font-weight:900;margin-top:8px;white-space:nowrap}
.fc4 .rk{display:flex;align-items:baseline;gap:4px;margin-top:12px}
.fc4 .rk b{font-family:var(--num);font-weight:800;font-size:46px;line-height:1;color:var(--text)}
.fc4 .rk span{font-family:var(--mono);font-size:13px;color:var(--faint)}
.fc4.top .rk b{color:var(--yel);text-shadow:0 0 12px rgba(249,240,2,.45)}
.fc4.top .gl{color:var(--yel)}
.fc4 .mt{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:10px}
.fc4 .mt i{height:8px;background:rgba(255,255,255,.08)}
.fc4 .mt i.on{background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.6)}
.fc4.top .mt i.on{background:var(--yel);box-shadow:0 0 6px rgba(249,240,2,.6)}
.fc4 .k{font-size:12px;font-weight:700;color:var(--faint);margin-top:18px}
.fc4 .it{font-size:17px;font-weight:700;line-height:1.3;margin-top:3px;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.fc4 .co{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:700;margin-top:3px;white-space:nowrap}
.fc4 .co i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex:none}
.fc4 .sub3{margin-top:auto;padding:14px 0 2px;display:grid;gap:8px}
.fc4 .sub3 div{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:700}
.fc4 .sub3 span{display:flex;gap:4px}
.fc4 .sub3 span i{width:9px;height:9px;transform:rotate(45deg);background:rgba(255,255,255,.12)}
.fc4 .sub3 span i.on{background:var(--mag);box-shadow:0 0 5px rgba(255,61,127,.7)}
.fc4{padding-bottom:4px}
.fmsg{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;text-align:center;line-height:1.7}

/* ---- ニュース ---- */
.news{flex:none;height:178px;display:flex;flex-direction:column;min-width:0}
#newsList{display:flex;flex-direction:column}
.nw{display:grid;grid-template-columns:82px 72px 1fr;align-items:center;height:27px;border-bottom:1px dashed rgba(5,217,232,.16)}
.nw:last-child{border-bottom:none}
.nw .tm{font-family:var(--mono);font-size:13px;color:var(--cyan)}
.nw .tg{justify-self:start;white-space:nowrap;font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--rule);padding:1px 6px;line-height:1.4}
.nw .tt{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw.new .tm{color:var(--mag)}
.nmsg{color:var(--sub);font-size:14px;padding-top:8px}

.foot{grid-area:foot;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-align:right;align-self:end}
.foot a{color:inherit}
#stage.port .foot{white-space:normal;line-height:1.6;align-self:start}
#offline{display:none;color:var(--yel)}

/* ---- タップできる場所 ---- */
.fc4,.nw{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc4:active,.nw:active{background:rgba(5,217,232,.08)}
.sh .tap{font-family:var(--jp);font-size:11px;color:var(--faint);letter-spacing:.02em}

/* ---- 詳細ウィンドウ ---- */
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,2,10,.8)}
.modal[hidden]{display:none}
.mbox{position:relative;width:860px;max-width:calc(100% - 60px);background:#120a22;padding:64px 34px 24px;
  clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,30px 100%,0 calc(100% - 30px));
  box-shadow:inset 0 0 0 1px rgba(5,217,232,.6),0 0 40px rgba(5,217,232,.18)}
.mbox.mag{box-shadow:inset 0 0 0 1px rgba(255,61,127,.6),0 0 40px rgba(255,61,127,.18)}
.mx{position:absolute;right:40px;top:18px;font-size:14px;font-weight:700;color:var(--sub);border:1px solid var(--rule);padding:4px 12px;background:none;font-family:var(--jp)}
.mtimer{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.mlab{font-size:12px;font-weight:700;color:var(--faint);margin-bottom:4px}
/* ニュース詳細 */
.nd{display:grid;grid-template-columns:1fr 200px;column-gap:28px}
.nd .meta{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--sub);font-weight:700;margin-bottom:12px}
.nd .meta .tg{font-size:12px;border:1px solid var(--rule);padding:1px 8px}
.nd h2{font-size:28px;font-weight:900;line-height:1.4;margin-bottom:14px}
.nd .img{width:100%;height:240px;object-fit:cover;margin-bottom:14px;background:#000}
.nd .sum{font-size:19px;line-height:1.75;color:#d8e6f3}
.nd .by{font-size:13px;color:var(--faint);margin-top:12px}
.qrbox{align-self:end;text-align:center}
.qrbox .qr{background:#fff;padding:10px;width:200px;height:200px}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox p{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
/* 占い詳細 */
.fd{display:grid;grid-template-columns:1fr 250px;column-gap:30px}
.fd .hd{display:flex;align-items:center;gap:18px}
.fd .gl{font-size:64px;line-height:1;color:var(--yel);font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp)}
.fd .nm{font-size:30px;font-weight:900}
.fd .rk{margin-left:auto;font-family:var(--num);font-weight:800;font-size:72px;line-height:1}
.fd .rk span{font-family:var(--mono);font-size:18px;color:var(--faint);margin-left:4px}
.fd .rk.top{color:var(--yel);text-shadow:0 0 14px rgba(249,240,2,.45)}
.fd .msg{font-size:22px;font-weight:900;line-height:1.6;margin:18px 0 16px;padding:12px 16px;border-left:3px solid var(--mag);background:rgba(255,61,127,.06)}
.fd .rows{display:grid;gap:10px}
.fd .row{display:grid;grid-template-columns:60px 120px 1fr;align-items:center;font-size:16px}
.fd .row b{font-weight:900}
.fd .row .dm{display:flex;gap:5px}
.fd .row .dm i{width:12px;height:12px;transform:rotate(45deg);background:rgba(255,255,255,.12)}
.fd .row .dm i.on{background:var(--mag);box-shadow:0 0 6px rgba(255,61,127,.7)}
.fd .row span{color:#d8e6f3}
.fd .lucky{display:flex;gap:30px;margin-top:16px;font-size:18px;font-weight:900}
.fd .lucky .co{display:flex;align-items:center;gap:8px}
.fd .lucky .co i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.fd{grid-template-columns:1fr 300px}
.fd .side{border-left:1px solid var(--rule);padding-left:24px;min-width:0}
.fd .side .mlab{margin-bottom:8px}
.fd .side .hint{font-size:11px;color:var(--faint);margin-top:8px}
.rs{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rs:active{background:rgba(5,217,232,.12)}
/* 案A：ランキング＋総合運バー */
.sa .rs{display:grid;grid-template-columns:30px 22px 1fr 84px;align-items:center;height:30px;font-size:15px;color:var(--sub);border-bottom:1px dashed rgba(5,217,232,.1)}
.sa .rs b{font-family:var(--num);font-weight:600;color:var(--faint);font-size:14px}
.sa .rs .g{font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp);color:var(--cyan);font-size:16px}
.sa .rs .bar{height:6px;background:rgba(255,255,255,.07);position:relative}
.sa .rs .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 6px rgba(5,217,232,.5)}
.sa .rs.mine{color:var(--text);font-weight:700}
.sa .rs.me{color:var(--yel);font-weight:900;background:rgba(249,240,2,.07)}
.sa .rs.me b,.sa .rs.me .g{color:var(--yel)}
.sa .rs.me .bar i{background:var(--yel);box-shadow:0 0 6px rgba(249,240,2,.6)}
/* 案B：12星座タイル */
.sb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sb .rs{position:relative;text-align:center;padding:8px 2px 7px;background:rgba(255,255,255,.035);border:1px solid rgba(5,217,232,.14)}
.sb .rs .g{display:block;font-family:"Noto Sans Symbols 2","Apple Symbols",var(--jp);font-size:24px;line-height:1.1;color:var(--cyan)}
.sb .rs .n{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:3px;white-space:nowrap}
.sb .rs b{position:absolute;right:4px;top:3px;font-family:var(--num);font-size:11px;color:var(--faint)}
.sb .rs.top3 b{color:var(--yel)}
.sb .rs.mine{border-color:rgba(255,255,255,.35)}
.sb .rs.mine .n{color:var(--text)}
.sb .rs.me{border-color:var(--yel);background:rgba(249,240,2,.1);box-shadow:0 0 12px rgba(249,240,2,.25)}
.sb .rs.me .g,.sb .rs.me .n{color:var(--yel)}
/* タイルの追加要素（案ごとに出し分け） */
.sb .rs .m,.sb .rs .big,.sb .rs .cd{display:none}
/* P2：タイル＋順位メーター */
.sb.v-meter .rs{padding-bottom:9px}
.sb.v-meter .rs .m{display:block;height:4px;margin:6px 8px 0;background:rgba(255,255,255,.08);position:relative}
.sb.v-meter .rs .m i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 5px rgba(5,217,232,.6)}
.sb.v-meter .rs.top3 .m i,.sb.v-meter .rs.me .m i{background:var(--yel);box-shadow:0 0 5px rgba(249,240,2,.6)}
/* P3：ヒートマップ（順位が高いほど明るい） */
.sb.v-heat .rs{background:rgba(5,217,232,var(--h));border-color:rgba(5,217,232,calc(var(--h) + .1))}
.sb.v-heat .rs.top3{background:rgba(249,240,2,calc(var(--h) * .9));border-color:rgba(249,240,2,.55)}
.sb.v-heat .rs.top3 .g{color:var(--yel)}
.sb.v-heat .rs.top3 .n{color:var(--text)}
.sb.v-heat .rs.me{box-shadow:0 0 0 2px var(--yel),0 0 14px rgba(249,240,2,.35)}
/* P4：順位を主役に（記号と名前は小さく、ラッキーカラーの点つき） */
.sb.v-rank .rs{padding:6px 4px 7px}
.sb.v-rank .rs > b{display:none}
.sb.v-rank .rs .big{display:block;font-family:var(--num);font-weight:800;font-size:26px;line-height:1.1;color:var(--text)}
.sb.v-rank .rs.top3 .big{color:var(--yel);text-shadow:0 0 10px rgba(249,240,2,.45)}
.sb.v-rank .rs .g{display:inline;font-size:13px}

const WEEK = ["日", "月", "火", "水", "木", "金", "土"], WEEK_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

/* ---------- 画面サイズに合わせて丸ごと拡大縮小 ---------- */
function fit() {
  const box = $("fit"), st = $("stage"), cs = getComputedStyle(box);
  const pl = parseFloat(cs.paddingLeft), pr = parseFloat(cs.paddingRight), pt = parseFloat(cs.paddingTop), pb = parseFloat(cs.paddingBottom);
  const aw = box.clientWidth - pl - pr, ah = box.clientHeight - pt - pb, port = ah > aw;
  st.className = port ? "port" : "land";
  const W = port ? 820 : 1180, H = port ? 1500 : 780, s = Math.min(aw / W, ah / H);
  st.style.transform = `translate(${pl + (aw - W * s) / 2}px, ${pt + (ah - H * s) / 2}px) scale(${s})`;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 300));

function jsonp(url, onData) {
  const cb = "cb" + Date.now() + Math.floor(Math.random() * 1e4), s = document.createElement("script");
  const timer = setTimeout(cleanup, 20000);
  function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
  window[cb] = (data) => { cleanup(); try { onData(data); } catch (e) {} };
  s.onerror = cleanup;
  s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&_=" + Date.now();
  document.body.appendChild(s);
}

/* ---------- 時計 ---------- */
function tick() {
  const d = new Date();
  $("time").innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">${pad(d.getSeconds())}</span>`;
  $("date").textContent = `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
  $("dateEn").textContent = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${WEEK_EN[d.getDay()]}`;
  renderTrain();
}

/* ---------- 天気 ---------- */
const WMO = {
  0: ["☀️", "快晴"], 1: ["🌤", "晴れ"], 2: ["⛅️", "晴れ時々くもり"], 3: ["☁️", "くもり"], 45: ["🌫", "霧"], 48: ["🌫", "霧"],
  51: ["🌦", "弱い霧雨"], 53: ["🌦", "霧雨"], 55: ["🌧", "強い霧雨"], 56: ["🌧", "霧雨"], 57: ["🌧", "霧雨"],
  61: ["🌦", "小雨"], 63: ["🌧", "雨"], 65: ["🌧", "強い雨"], 66: ["🌧", "冷たい雨"], 67: ["🌧", "冷たい強い雨"],
  71: ["🌨", "小雪"], 73: ["🌨", "雪"], 75: ["❄️", "大雪"], 77: ["🌨", "霧雪"], 80: ["🌦", "にわか雨"], 81: ["🌧", "にわか雨"],
  82: ["⛈", "激しいにわか雨"], 85: ["🌨", "にわか雪"], 86: ["❄️", "強いにわか雪"], 95: ["⛈", "雷雨"], 96: ["⛈", "雷雨"], 99: ["⛈", "激しい雷雨"],
};
const wmo = (c) => WMO[c] || ["❔", "不明"];
let lastWeather = null, maxRain = 0, statusAt = "";

async function loadWeather() {
  const p = new URLSearchParams({
    latitude: CONFIG.latitude, longitude: CONFIG.longitude, timezone: "Asia/Tokyo",
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code",
    hourly: "temperature_2m,precipitation_probability,weather_code",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max", forecast_days: "4",
  });
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?" + p, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    lastWeather = await r.json(); renderWeather(lastWeather); $("offline") && ($("offline").style.display = "none");
  } catch (e) {
    if (!lastWeather) $("nowDesc").textContent = "取得できません";
  }
  renderFoot();
}
let weatherAt = "";
function renderWeather(w) {
  const c = w.current, [icon, desc] = wmo(c.weather_code), D = w.daily, H = w.hourly, now = Date.now();
  $("placeLabel").textContent = CONFIG.placeName;
  $("nowIcon").textContent = icon;
  $("nowTemp").innerHTML = `${Math.round(c.temperature_2m)}<sup>°C</sup>`;
  $("nowDesc").textContent = desc;
  $("hiT").textContent = `${Math.round(D.temperature_2m_max[0])}°`;
  $("loT").textContent = `${Math.round(D.temperature_2m_min[0])}°`;
  $("feels").textContent = `${Math.round(c.apparent_temperature)}°`;
  $("hum").textContent = `${Math.round(c.relative_humidity_2m)}%`;
  let start = H.time.findIndex((t) => new Date(t).getTime() + 3600e3 > now); if (start < 0) start = 0;
  $("popNow").textContent = `${H.precipitation_probability[start] ?? "-"}%`;
  let html = ""; maxRain = 0;
  for (let i = start; i < start + 12 && i < H.time.length; i++) {
    const pr = H.precipitation_probability[i] ?? 0; maxRain = Math.max(maxRain, pr);
    html += `<div class="h"><div class="t">${new Date(H.time[i]).getHours()}時</div><div class="i">${wmo(H.weather_code[i])[0]}</div>
      <div class="v">${Math.round(H.temperature_2m[i])}°</div><div class="bar"><i style="height:${Math.max(1, pr * 0.18)}px"></i></div><div class="p">${pr}%</div></div>`;
  }
  $("hours").innerHTML = html;
  $("days").innerHTML = D.time.map((t, i) => {
    const d = new Date(t + "T00:00:00"), name = i === 0 ? "今日" : i === 1 ? "明日" : `${d.getMonth() + 1}/${d.getDate()}`;
    return `<div class="day"><div>${name}</div><div class="i">${wmo(D.weather_code[i])[0]}</div>
      <div class="v"><span class="hi">${Math.round(D.temperature_2m_max[i])}</span>/<span class="lo">${Math.round(D.temperature_2m_min[i])}</span></div>
      <div class="p">${D.precipitation_probability_max[i] ?? "-"}%</div></div>`;
  }).join("");
  weatherAt = hm(new Date());
  renderAlerts();
}

/* ---------- 祝日 ---------- */
let holidays = {}, holidaysLoadedOn = "";
async function loadHolidays() {
  try { const r = await fetch("https://holidays-jp.github.io/api/v1/date.json", { cache: "no-store" });
    if (r.ok) { holidays = await r.json(); holidaysLoadedOn = ymd(new Date()); } } catch (e) {}
}
function isHolidayDia(d) {
  if (d.getDay() === 0 || d.getDay() === 6) return true;
  if (holidays[ymd(d)]) return true;
  return CONFIG.train.extraHolidayDates.includes(`${pad(d.getMonth() + 1)}-${pad(d.getDate())}`);
}

/* ---------- 電車 ---------- */
function serviceDay(now) {
  const d = new Date(now); let minsNow = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  if (d.getHours() < 3) { d.setDate(d.getDate() - 1); minsNow += 1440; }
  d.setHours(0, 0, 0, 0); return { base: d, minsNow };
}
function departuresOf(day) {
  const t = isHolidayDia(day) ? CONFIG.train.holiday : CONFIG.train.weekday, list = [];
  Object.keys(t).map(Number).sort((a, b) => a - b).forEach((h) => t[h].forEach((m) => list.push(h * 60 + m)));
  return list;
}
function upcoming() {
  const { base, minsNow } = serviceDay(new Date()), out = []; let day = new Date(base), off = 0;
  for (let k = 0; k < 2; k++) {
    for (const m of departuresOf(day)) if (m + off >= minsNow) out.push({ at: new Date(base.getTime() + (m + off) * 60e3), holiday: isHolidayDia(day) });
    day = new Date(day.getTime() + 864e5); off += 1440;
  }
  return out;
}
function remain(d) {
  const s = Math.max(0, Math.floor((d - Date.now()) / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`;
}
function renderTrain() {
  const list = upcoming();

  if (!list.length) return;
  const { base } = serviceDay(new Date()), first = list[0], gap = (first.at - Date.now()) / 3600e3, el = $("nextIn");
  if (gap > 2) {
    $("diaLabel").textContent = `始発は${first.holiday ? "土休日" : "平日"}ダイヤ`;
    $("cdLab").textContent = "";
    el.className = "txt"; el.textContent = "本日の運行は終了";
    $("nextAt").innerHTML = `始発 <b>${hm(first.at)}</b>`;
    $("tBoard").innerHTML = `<div class="r"><span class="dst" style="grid-column:1/-1;font-family:var(--mono);color:var(--faint);font-size:13px">始発から</span></div>` +
      list.slice(0, 3).map((x) => `<div class="r"><span class="tm">${hm(x.at)}</span><span class="dst">野田阪神 行</span><span class="rm">${remain(x.at)}</span></div>`).join("");
    return;
  }
  $("diaLabel").textContent = `${isHolidayDia(base) ? "土休日" : "平日"}ダイヤ`;
  $("cdLab").textContent = "発車まで";
  const isLast = (x) => { const n = list[list.indexOf(x) + 1]; return !n || n.at - x.at > 2 * 3600e3; };
  el.className = (first.at - Date.now()) < 60e3 ? "soon" : "";
  el.textContent = remain(first.at);
  $("nextAt").innerHTML = `<b>${hm(first.at)}</b>発 野田阪神行${isLast(first) ? "（終電）" : ""}`;
  const rows = [];
  const maxRows = document.querySelector(".train").classList.contains("has-detail") ? 3 : 4;
  for (let i = 1; i < list.length && rows.length < maxRows; i++) {
    if (list[i].at - list[i - 1].at > 2 * 3600e3) break;
    rows.push(list[i]);
  }
  $("tBoard").innerHTML = rows.map((x) => `<div class="r${isLast(x) ? " last" : ""}"><span class="tm">${hm(x.at)}</span>` +
    `<span class="dst">野田阪神 行</span><span class="rm">${remain(x.at)}</span></div>`).join("");
}

];
const swatch = (name) => { const hit = COLOR_MAP.find(([k]) => String(name).includes(k)); return hit ? hit[1] : null; };
/* 日付の文字列から、毎回同じ並びになる乱数を作る */
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const ALL_SIGNS = ["牡羊座", "牡牛座", "双子座", "蟹座", "獅子座", "乙女座", "天秤座", "蠍座", "射手座", "山羊座", "水瓶座", "魚座"];
function makeFortune(dateStr) {
  const r = seeded("smoke-board|" + dateStr);
  const order = ALL_SIGNS.slice();
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const clamp = (v) => Math.max(1, Math.min(5, v));
  return order.map((sign, idx) => {
    const rank = idx + 1, base = rank <= 2 ? 5 : rank <= 5 ? 4 : rank <= 8 ? 3 : rank <= 11 ? 2 : 1;
    const v = () => clamp(base + Math.floor(r() * 3) - 1);
    return { sign, rank, total: base, love: v(), money: v(), job: v(), item: pick(CONFIG.fortune.items), color: pick(CONFIG.fortune.colors) };
  });
}
let fortuneDate = "", todayFortune = [];
function renderFortune() {
  const d = new Date(), key = ymd(d);
  if (key === fortuneDate) return;
  fortuneDate = key;
  const items = makeFortune(key);
  todayFortune = items;
  $("fDate").textContent = `${d.getMonth() + 1}/${d.getDate()}`;
  $("fCols").innerHTML = CONFIG.fortune.signs.map((s) => {
    const f = items.find((x) => x.sign === s.key);
    const on = 13 - f.rank, sw = swatch(f.color);
    return `<div class="fc4${f.rank <= 3 ? " top" : ""}" data-sign="${s.key}">
      <div class="gl">${s.glyph}</div><div class="nm">${s.name}</div>
      <div class="rk"><b>${pad(f.rank)}</b><span>/12</span></div>
      <div class="mt">${Array.from({ length: 12 }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join("")}</div>
      <div class="k">ラッキーアイテム</div><div class="it">${esc(f.item)}</div>
      <div class="k">ラッキーカラー</div><div class="co">${sw ? `<i style="background:${sw}"></i>` : ""}${esc(f.color)}</div>
      <div class="sub3">${[["恋愛", f.love], ["金運", f.money], ["仕事", f.job]].map(([k, v]) =>
        `<div>${k}<span>${Array.from({ length: 5 }, (_, i) => `<i class="${i < v ? "on" : ""}"></i>`).join("")}</span></div>`).join("")}</div>
    </div>`;
  }).join("");
  shrinkToFit(".fc4 .it", 11);
}

/* 長い文字は改行せず、枠に収まる大きさにする。
   まず文字数から大きさを決め（書体の読み込みに左右されない）、念のため実寸でも確認して縮める */
function shrinkToFit(sel, min) {
  document.querySelectorAll(sel).forEach((el) => {
    const w = el.clientWidth;
    if (!w) return;
    const units = [...el.textContent].reduce((n, c) => n + (/[\u0000-\u00ff]/.test(c) ? 0.6 : 1.04), 0);
    let fs = Math.max(min, Math.min(19, Math.floor((w / units) * 2) / 2));
    el.style.fontSize = fs + "px";
    while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 0.5; el.style.fontSize = fs + "px"; }
  });
}

/* ---------- ニュース ---------- */
// 配信からの経過時間（「25分前」「3時間前」「2日前」）
function ago(t) {
  const m = Math.max(0, Math.floor((Date.now() - t) / 60e3));
  return m < 60 ? `${m}分前` : m < 1440 ? `${Math.floor(m / 60)}時間前` : `${Math.floor(m / 1440)}日前`;
}
let newsAt = "", newsItems = [];
function loadNews() {
  if (!CONFIG.relayUrl) return;
  jsonp(CONFIG.relayUrl + "?type=news", (d) => {
    if (!d || !d.ok || !d.items) {
      if (!newsAt) $("newsList").innerHTML = `<div class="nmsg">${d && d.items === undefined && d.line
        ? "ニュースを表示するには、中継スクリプトの更新が必要です" : "ニュースを取得できませんでした（自動で再取得します）"}</div>`;
      return;
    }
    const now = Date.now();
    newsItems = d.items.slice(0, CONFIG.news.count);
    $("newsList").innerHTML = newsItems.map((n, idx) => {
      const t = new Date(n.pubDate), fresh = now - t < CONFIG.news.newWithinMin * 60e3;
      return `<div class="nw${fresh ? " new" : ""}" data-i="${idx}"><span class="tm">${isNaN(t) ? "" : ago(t)}</span><span class="tg">${esc(n.tag || "")}</span><span class="tt">${esc(n.title)}</span></div>`;
    }).join("");
    newsAt = hm(new Date());
    $("newsAt").textContent = `WSJ日本版 ・ ${newsAt} 更新`;
    renderFoot();
  });
}

let closeTimer = null, timerAnim = null;
function openModal(html, accent) {
  $("mbody").innerHTML = html;

  if (bar.animate) timerAnim = bar.animate([{ width: "100%" }, { width: "0%" }], { duration: ms, easing: "linear", fill: "forwards" });

function closeModal() { $("modal").hidden = true; clearTimeout(closeTimer); if (timerAnim) timerAnim.cancel(); }

// 記者名の区切りの乱れ（「,、」など）を整える
function cleanAuthor(a) {
  return String(a || "").split(/[、,，]/).map((x) => x.trim()).filter(Boolean).join("、");
}
function qrSvg(url) {
  try { const q = qrcode(0, "M"); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  catch (e) { return ""; }
}
$("newsList").addEventListener("click", (e) => {
  const row = e.target.closest(".nw"); if (!row) return;
  const n = newsItems[+row.dataset.i]; if (!n) return;
  const t = new Date(n.pubDate);
  const when = isNaN(t) ? "" : `${t.getMonth() + 1}/${t.getDate()} ${hm(t)}（${ago(t)}）`;
  const qr = n.link ? qrSvg(n.link) : "";
  openModal(`<div class="nd"><div>
      <div class="meta"><span class="tg">${esc(n.tag || "")}</span><span>${when}</span><span>WSJ日本版</span></div>
      <h2>${esc(n.title)}</h2>
      ${n.image ? `<img class="img" src="${esc(n.image)}" alt="" onerror="this.remove()">` : ""}
      <div class="sum">${esc(n.description || "（要約はありません）")}</div>
      ${cleanAuthor(n.author) ? `<div class="by">${esc(cleanAuthor(n.author))}</div>` : ""}
    </div>
    <div class="qrbox">${qr ? `<div class="qr">${qr}</div><p>スマホのカメラで読み取ると<br>記事の続きが開きます<br>（WSJの有料記事の場合あり）</p>` : ""}</div>
  </div>`);
});

function sidePanel(cur) {
  const mine = CONFIG.fortune.signs.map((x) => x.key);
  const cls = (x) => `rs${x.sign === cur ? " me" : mine.includes(x.sign) ? " mine" : ""}`;

    const order = ALL_SIGNS.map((k) => todayFortune.find((x) => x.sign === k));

/* ---------- 注意表示 ---------- */
function renderAlerts() {
  const a = [];
  if (trainStatus && trainStatus.ok && trainStatus.level !== "normal") a.push(`<span class="a ${trainStatus.level === "stop" ? "s" : "w"}">千日前線 ${esc(trainStatus.status)}</span>`);
  if (maxRain >= CONFIG.umbrellaThreshold) a.push(`<span class="a">傘を持っていこう　最大${maxRain}%</span>`);
  if (lastWeather) {
    const t = lastWeather.current.apparent_temperature;
    if (t >= 31) a.push(`<span class="a w">体感${Math.round(t)}°　水分補給を</span>`);
    if (t <= 3) a.push(`<span class="a">体感${Math.round(t)}°　上着を</span>`);

  $("alerts").innerHTML = a.join("");
}

}

/* ---------- 画面を消さない ---------- */
async function keepAwake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("click", keepAwake);

if (document.fonts) document.fonts.ready.then(() => { fit(); shrinkToFit(".fc4 .it", 11); });
[1500, 5000].forEach((ms) => setTimeout(() => shrinkToFit(".fc4 .it", 11), ms));
setTimeout(() => location.reload(), CONFIG.fullReloadHours * 3600e3);
